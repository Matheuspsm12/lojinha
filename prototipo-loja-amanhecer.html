// ---------- Envio de fotos (protótipo: o envio é simulado, o resto é real) ----------
const FOTOS_ACEITAS = ["jpg", "jpeg", "png", "webp", "avif", "heic", "heif"];
const LIMITE_FOTO_MB = 60;
const tamanhoMB = b => (b / 1048576).toFixed(b < 1048576 ? 2 : 1) + " MB";

function itemEnvioHtml(a) {
  const classe = a.situacao === "pronto" ? "pronto" : a.situacao === "erro" ? "erro" : "";
  const situacao = a.situacao === "pronto" ? "Pronta" : a.situacao === "erro" ? "Recusada" : a.situacao === "processando" ? "Otimizando…" : `${a.progresso}%`;
  const previa = a.previa ? `<img src="${a.previa}" alt="">` : a.formato === "HEIC" ? "HEIC" : "Foto";
  return `<div class="envio-item ${classe}" id="envio-${a.id}">
    <span class="previa">${previa}</span>
    <span><span class="nome">${esc(a.nome)}</span>
      <span class="detalhe">${a.detalhe || tamanhoMB(a.bytes)}</span>
      <span class="barra-progresso"><div style="width:${a.situacao === "pronto" ? 100 : a.progresso}%"></div></span></span>
    <span class="envio-situacao">${situacao}</span>
  </div>`;
}

function atualizarItemEnvio(a) {
  const alvo = document.getElementById(`envio-${a.id}`);
  if (alvo) alvo.outerHTML = itemEnvioHtml(a);
  else { const fila = document.getElementById("filaEnvio"); if (fila) fila.insertAdjacentHTML("beforeend", itemEnvioHtml(a)); }
}

function soltarFotos(evento) {
  evento.preventDefault();
  evento.currentTarget.classList.remove("arrastando");
  enviarFotos(evento.dataTransfer.files);
}

/* Envia uma foto de cada vez, sem travar a tela: a barra mostra o progresso do envio
   e depois a etapa de otimização. Na versão final isto vira um POST para
   /api/admin/produtos/{id}/imagens com XMLHttpRequest e evento upload.onprogress. */
function enviarFotos(lista) {
  if (!rascunho) return;
  rascunho.arquivos = rascunho.arquivos || [];
  [...lista].forEach(arquivo => {
    const ext = (arquivo.name.split(".").pop() || "").toLowerCase();
    const item = {
      id: Math.random().toString(36).slice(2, 9), nome: arquivo.name, bytes: arquivo.size,
      formato: ext.toUpperCase(), progresso: 0, situacao: "enviando", previa: null, detalhe: ""
    };
    rascunho.arquivos.push(item);

    if (!FOTOS_ACEITAS.includes(ext) && !arquivo.type.startsWith("image/")) {
      item.situacao = "erro"; item.detalhe = "Formato não aceito. Use JPG, PNG, WEBP, AVIF ou HEIC.";
      atualizarItemEnvio(item); return;
    }
    if (arquivo.size > LIMITE_FOTO_MB * 1048576) {
      item.situacao = "erro"; item.detalhe = `${tamanhoMB(arquivo.size)} passa do limite de ${LIMITE_FOTO_MB} MB.`;
      atualizarItemEnvio(item); return;
    }
    // HEIC não abre no navegador: a prévia só aparece depois da conversão no servidor
    if (["heic", "heif"].includes(ext)) item.detalhe = `${tamanhoMB(arquivo.size)} · HEIC será convertido para WebP`;
    else try { item.previa = URL.createObjectURL(arquivo); } catch (e) { /* sem prévia */ }

    atualizarItemEnvio(item);
    simularEnvio(item);
  });
}

function simularEnvio(item) {
  const passo = () => {
    item.progresso = Math.min(100, item.progresso + Math.max(4, Math.round(100 / Math.max(6, item.bytes / 1048576 * 4))));
    atualizarItemEnvio(item);
    if (item.progresso < 100) setTimeout(passo, 120);
    else {
      item.situacao = "processando";
      item.detalhe = "Corrigindo orientação e gerando miniatura, catálogo e página do produto…";
      atualizarItemEnvio(item);
      setTimeout(() => {
        item.situacao = "pronto";
        item.detalhe = `Original de ${tamanhoMB(item.bytes)} guardado · 3 versões WebP criadas`;
        atualizarItemEnvio(item);
        // entra no fim da galeria do produto que está aberto
        if (rascunho) galeriaDoRascunho().push({ id: `arq-${item.id}`, tipo: "previa", previa: item.previa, nome: item.nome });
        toast(`${item.nome} pronta para a loja.`);
        render();
      }, 900);
    }
  };
  setTimeout(passo, 150);
}

// ---------- Galeria do produto no painel: excluir, trocar e escolher a capa ----------
let fotoEmTroca = null;

/** A galeria fica no rascunho enquanto o formulário está aberto; ao salvar, vai para o produto. */
function galeriaDoRascunho() {
  if (!rascunho) return [];
  if (!Array.isArray(rascunho.galeria)) rascunho.galeria = galeriaDoProduto(rascunho);
  return rascunho.galeria;
}

function excluirFotoProduto(id) {
  const galeria = galeriaDoRascunho();
  const i = galeria.findIndex(f => f.id === id);
  if (i < 0) return;
  const eraCapa = i === 0;
  if (!confirm(`Excluir esta foto do produto?${eraCapa ? "\n\nEla é a capa: a próxima foto passa a ser a capa." : ""}\n\nO arquivo também sai do armazenamento. As outras fotos e o produto não são afetados.`)) return;

  galeria.splice(i, 1);   // sai só esta foto
  toast(galeria.length
    ? `Foto excluída.${eraCapa ? " A próxima virou a capa." : ""} Salve o produto para valer na loja.`
    : "Foto excluída. Sem fotos, a loja mostra a imagem padrão.");
  render();
}

function definirCapa(id) {
  const galeria = galeriaDoRascunho();
  const i = galeria.findIndex(f => f.id === id);
  if (i <= 0) return;
  galeria.unshift(galeria.splice(i, 1)[0]);
  toast("Foto definida como capa.");
  render();
}

function trocarFotoProduto(id) {
  fotoEmTroca = id;
  document.getElementById("trocarFotoArquivo").click();
}

function aplicarTrocaDeFoto(arquivo) {
  if (!arquivo || !fotoEmTroca) return;
  const ext = (arquivo.name.split(".").pop() || "").toLowerCase();
  if (!FOTOS_ACEITAS.includes(ext) && !arquivo.type.startsWith("image/")) return toast("Formato não aceito. Use JPG, PNG, WEBP, AVIF ou HEIC.");
  if (arquivo.size > LIMITE_FOTO_MB * 1048576) return toast(`A foto tem ${tamanhoMB(arquivo.size)} e passa do limite de ${LIMITE_FOTO_MB} MB.`);

  const alvo = fotoEmTroca;
  const leitor = new FileReader();
  leitor.onload = () => {
    const galeria = galeriaDoRascunho();
    const i = galeria.findIndex(f => f.id === alvo);
    if (i >= 0) galeria[i] = { id: `arq-${Date.now()}`, tipo: "previa", previa: leitor.result, nome: arquivo.name };
    fotoEmTroca = null;
    toast("Foto substituída, na mesma posição. O arquivo antigo sai do armazenamento ao salvar.");
    render();
  };
  leitor.onerror = () => { fotoEmTroca = null; toast("Não foi possível ler este arquivo."); };
  leitor.readAsDataURL(arquivo);
}

function gerarVariacoes() {
  const r = rascunho; const antigas = r.variacoes;
  const combos = r.opcoes.filter(o => o.valores.length).reduce((acc, o) => acc.flatMap(a => o.valores.map(v => ({ ...a, [o.nome]: v }))), [{}]);
  r.variacoes = r.opcoes.some(o => o.valores.length) ? combos.map(attrs => antigas.find(v => JSON.stringify(v.attrs) === JSON.stringify(attrs)) || { attrs, estoque: 0 }) : [];
  render();
}
function salvarProduto() {
  const r = rascunho;
  const erros = [];
  if (!r.nome.trim()) erros.push("nome");
  if (!(r.preco > 0)) erros.push("preço");
  if (!(r.peso > 0) || r.dim.some(d => !(d > 0))) erros.push("peso e dimensões");
  if (r.disponibilidade === "SobEncomenda" && !(r.prazoProducao > 0)) erros.push("prazo de produção");
  if (erros.length) return toast("Preencha: " + erros.join(", ") + ".");
  r.galeria = galeriaDoRascunho();
  r.fotos = r.galeria.filter(f => f.tipo === "arte").length;
  if (r._origem === "novo") {
    // deixa P() gerar o id e o slug do produto novo
    const dados = { ...r }; delete dados.id; delete dados._origem; delete dados.slug;
    db.produtos.unshift(P(dados));
  }
  else { const alvo = db.produtos.find(p => p.id === +r._origem); Object.assign(alvo, JSON.parse(JSON.stringify(r))); delete alvo._origem; }
  rascunho = null; toast("Produto salvo."); location.hash = "#/painel/produtos";
}

// ---------- Foto da categoria: envio, enquadramento e remoção ----------
const recorteEstado = { categoriaId: null, img: null, escala: 1, escalaMin: 1, x: 0, y: 0, lado: 340, arrastando: false, ultimo: null };

function categoriaPorIdQualquer(id) {
  for (const c of db.categorias) {
    if (c.id === id) return c;
    const s = c.subs.find(x => x.id === id);
    if (s) return s;
  }
  return null;
}

function escolherFotoCategoria(id) {
  recorteEstado.categoriaId = id;
  const entrada = document.getElementById("arquivoCategoria") || (() => {
    const i = document.createElement("input");
    i.type = "file"; i.id = "arquivoCategoria"; i.className = "oculto";
    i.accept = "image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.avif,.heic,.heif";
    i.onchange = () => { abrirRecorte(i.files[0]); i.value = ""; };
    document.body.appendChild(i);
    return i;
  })();
  entrada.click();
}

function removerFotoCategoria(id) {
  const c = categoriaPorIdQualquer(id);
  if (!c || !confirm(`Remover a foto de "${c.nome}"? A loja volta a mostrar a ilustração padrão.`)) return;
  c.foto = null;
  toast("Foto removida. A categoria voltou para a ilustração padrão.");
  render();
}

function abrirRecorte(arquivo) {
  if (!arquivo) return;
  const ext = (arquivo.name.split(".").pop() || "").toLowerCase();
  if (arquivo.size > LIMITE_FOTO_MB * 1048576) return toast(`A foto tem ${tamanhoMB(arquivo.size)} e passa do limite de ${LIMITE_FOTO_MB} MB.`);
  if (!FOTOS_ACEITAS.includes(ext) && !arquivo.type.startsWith("image/")) return toast("Formato não aceito. Use JPG, PNG, WEBP, AVIF ou HEIC.");

  const janela = document.getElementById("janelaRecorte");
  janela.showModal();
  $("#recorteNome").textContent = `${arquivo.name} · ${tamanhoMB(arquivo.size)}`;
  $("#recorteAviso").textContent = "";
  $("#recorteSalvar").disabled = true;

  const img = new Image();
  img.onload = () => {
    recorteEstado.img = img;
    const area = $("#recorteArea");
    recorteEstado.lado = area.clientWidth || 340;
    // começa com a foto cobrindo todo o círculo
    recorteEstado.escalaMin = Math.max(recorteEstado.lado / img.naturalWidth, recorteEstado.lado / img.naturalHeight);
    recorteEstado.escala = recorteEstado.escalaMin;
    recorteEstado.x = (recorteEstado.lado - img.naturalWidth * recorteEstado.escala) / 2;
    recorteEstado.y = (recorteEstado.lado - img.naturalHeight * recorteEstado.escala) / 2;
    area.innerHTML = `<img id="recorteImg" src="${img.src}" alt=""><span class="recorte-moldura"></span>`;
    $("#recorteZoom").value = "1";
    $("#recorteInfo").textContent = `Foto de ${img.naturalWidth} × ${img.naturalHeight} px`;
    $("#recorteSalvar").disabled = false;
    posicionarRecorte();
  };
  img.onerror = () => {
    // HEIC não abre no navegador: no sistema real o servidor converte e devolve a prévia
    $("#recorteAviso").textContent = "O navegador não abre HEIC para pré-visualizar. No sistema, a foto é convertida no servidor e o enquadramento pode ser ajustado depois do envio.";
    $("#recorteSalvar").disabled = true;
  };
  img.src = URL.createObjectURL(arquivo);
}

function posicionarRecorte() {
  const e = recorteEstado, img = $("#recorteImg");
  if (!img) return;
  const l = e.img.naturalWidth * e.escala, a = e.img.naturalHeight * e.escala;
  // não deixa sobrar buraco nas bordas do círculo
  e.x = Math.min(0, Math.max(e.x, e.lado - l));
  e.y = Math.min(0, Math.max(e.y, e.lado - a));
  img.style.width = `${l}px`;
  img.style.height = `${a}px`;
  img.style.transform = `translate(${e.x}px, ${e.y}px)`;
}

function zoomRecorte(valor) {
  const e = recorteEstado;
  const anterior = e.escala;
  e.escala = e.escalaMin * parseFloat(valor);
  // mantém o centro do enquadramento ao aproximar ou afastar
  const centro = e.lado / 2;
  e.x = centro - (centro - e.x) * (e.escala / anterior);
  e.y = centro - (centro - e.y) * (e.escala / anterior);
  posicionarRecorte();
}

function arrastarRecorte(evento, fase) {
  const e = recorteEstado;
  const ponto = evento.touches ? evento.touches[0] : evento;
  if (fase === "inicio") { e.arrastando = true; e.ultimo = { x: ponto.clientX, y: ponto.clientY }; $("#recorteArea").classList.add("arrastando"); return; }
  if (fase === "fim") { e.arrastando = false; e.ultimo = null; $("#recorteArea").classList.remove("arrastando"); return; }
  if (!e.arrastando || !e.ultimo) return;
  evento.preventDefault();
  e.x += ponto.clientX - e.ultimo.x;
  e.y += ponto.clientY - e.ultimo.y;
  e.ultimo = { x: ponto.clientX, y: ponto.clientY };
  posicionarRecorte();
}

/* Gera a versão quadrada do medalhão. No sistema real, o painel envia a foto original
   e as coordenadas do recorte para POST /api/admin/categorias/{id}/imagem, e quem
   corrige a orientação, recorta, redimensiona e converte para WebP é o servidor. */
function salvarFotoCategoria() {
  const e = recorteEstado;
  const c = categoriaPorIdQualquer(e.categoriaId);
  if (!c || !e.img) return;
  const lado = 600;
  const tela = document.createElement("canvas");
  tela.width = lado; tela.height = lado;
  const ctx = tela.getContext("2d");
  const fator = lado / e.lado;
  ctx.drawImage(e.img, e.x * fator, e.y * fator, e.img.naturalWidth * e.escala * fator, e.img.naturalHeight * e.escala * fator);
  c.foto = tela.toDataURL("image/webp", 0.82);
  document.getElementById("janelaRecorte").close();
  toast(`Foto de "${c.nome}" salva e otimizada.`);
  render();
}

/** Quantos produtos estão nesta categoria (contando as subcategorias, quando for uma principal). */
function produtosDaCategoria(id) {
  const { cat, pai } = categoriaPorId(id);
  if (!cat) return 0;
  const ids = pai ? [cat.id] : [cat.id, ...cat.subs.map(s => s.id)];
  return db.produtos.filter(p => ids.includes(p.categoria)).length;
}

function alternarCategoria(ci, si) {
  const alvo = si == null ? db.categorias[ci] : db.categorias[ci].subs[si];
  const vaiDesativar = alvo.ativa !== false;
  const quantos = produtosDaCategoria(alvo.id);
  if (vaiDesativar && quantos && !confirm(`Desativar "${alvo.nome}"?\n\n${quantos} produto(s) continuam vinculados a ela e mantêm a categoria, mas saem da loja até ela ser reativada.`)) return;
  alvo.ativa = !vaiDesativar;
  toast(vaiDesativar ? `"${alvo.nome}" desativada: sai da loja e do cadastro de produtos novos.` : `"${alvo.nome}" reativada.`);
  render();
}

/* Mesma regra da API: categoria com produtos ou com subcategorias não é excluída. */
function excluirCategoria(ci, si) {
  const c = db.categorias[ci];
  const alvo = si == null ? c : c.subs[si];
  const quantos = produtosDaCategoria(alvo.id);
  if (quantos) return toast(`"${alvo.nome}" tem ${quantos} produto(s). Mova-os para outra categoria ou apenas desative esta.`);
  if (si == null && c.subs.length) return toast(`"${alvo.nome}" tem subcategorias. Remova ou mova as subcategorias antes de excluir.`);
  if (!confirm(`Excluir a categoria "${alvo.nome}"? Ela sai da loja e do cadastro de produtos.`)) return;
  if (si == null) db.categorias.splice(ci, 1); else c.subs.splice(si, 1);
  toast("Categoria excluída.");
  render();
}

function criarCategoria(f) {
  const nome = f.nome.value.trim(); if (!nome) return;
  const id = normaliza(nome).replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString(36);
  if (f.pai.value) db.categorias.find(c => c.id === f.pai.value).subs.push({ id, nome, ativa: true });
  else db.categorias.push({ id, nome, arte: "outros", cor: "#6b4fa8", ativa: true, subs: [] });
  f.reset();
  toast("Categoria criada. Já aparece no cadastro de produtos e na loja.");
  render();
}
function renomearCategoria(ci, si) {
  const alvo = si == null ? db.categorias[ci] : db.categorias[ci].subs[si];
  const novo = prompt("Novo nome:", alvo.nome); if (novo && novo.trim()) { alvo.nome = novo.trim(); toast("Categoria renomeada."); render(); }
}

      <h3 style="margin-top:20px;font-size:1.15rem">Pedidos por status</h3>

// ---------- Mapa de calor dos produtos: cliques (visitas à página) x vendas, lado a lado ----------
function celulaCalor(valor, max) {
  const t = max > 0 ? valor / max : 0;
  const de = [253, 246, 227], ate = [193, 18, 31];   // creme claro -> vermelho, quanto mais alto mais quente
  const [r, g, b] = de.map((c, i) => Math.round(c + (ate[i] - c) * t));
  return `background:rgb(${r},${g},${b});color:${t > 0.55 ? "#fff" : "var(--tinta)"};font-weight:700;text-align:center;border-radius:6px`;
}
function mapaCalorProdutos() {
  const linhas = db.produtos.map(p => ({ nome: p.nome, cliques: db.cliques[p.id] || 0, vendidos: p.vendidos }))
    .filter(x => x.cliques > 0 || x.vendidos > 0)
    .sort((a, b) => b.cliques - a.cliques).slice(0, 12);
  const maxCliques = Math.max(...linhas.map(x => x.cliques), 1);
  const maxVendidos = Math.max(...linhas.map(x => x.vendidos), 1);
  return `<section class="cartao" style="margin-top:20px">
    <div class="secao-cabecalho" style="margin-bottom:6px"><h2 style="font-size:1.4rem;margin:0">Mapa de calor dos produtos</h2><button class="btn btn-contorno btn-pequeno" type="button" onclick="exportarCSV('desempenho')">Exportar</button></div>
    <p style="color:var(--tinta-suave);margin:-2px 0 12px;font-size:.88rem">Quanto mais escuro, mais movimento. "Cliques" conta as visitas à página do produto; "Vendidos" vem dos pedidos pagos.</p>
    <div class="tabela-rolagem"><table>
      <thead><tr><th>Produto</th><th>Cliques</th><th>Vendidos</th><th>Conversão</th></tr></thead>
      <tbody>${linhas.map(x => `<tr>
        <td><strong>${esc(x.nome)}</strong></td>
        <td style="${celulaCalor(x.cliques, maxCliques)}">${x.cliques}</td>
        <td style="${celulaCalor(x.vendidos, maxVendidos)}">${x.vendidos}</td>
        <td style="text-align:center">${x.cliques ? (x.vendidos / x.cliques * 100).toFixed(1).replace(".", ",") : "0,0"}%</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="aviso" style="margin-top:14px">No sistema, os cliques vêm de <code>GET /api/produtos/{slug}</code> (cada visita à página soma 1, sem precisar o cliente estar logado) e esse cruzamento com as vendas fica em <code>/api/admin/relatorios/desempenho-produtos</code>. Só a equipe vê essa tela.</div>
  </section>`;
}

// Exporta CSV com BOM (abre direto no Excel com acentos). A API real gera .xlsx.
function exportarCSV(tipo) {
  let linhas;
  if (tipo === "produtos") linhas = [["Nome", "Categoria", "Preço", "Estoque", "Disponibilidade", "Prazo produção", "Peso (g)", "Ativo"], ...db.produtos.map(p => [p.nome, categoriaPorId(p.categoria).cat.nome, p.preco.toFixed(2).replace(".", ","), estoqueTotal(p), p.disponibilidade === "SobEncomenda" ? "Sob encomenda" : "Pronta entrega", p.prazoProducao, p.peso, p.ativo ? "Sim" : "Não"])];
  else if (tipo === "clientes") linhas = [["Nome", "E-mail", "Celular", "Cliente desde", "Pedidos"], ...db.clientes.map(c => [c.nome, c.email, c.telefone, dataBR(c.criadoEm), db.pedidos.filter(p => p.clienteId === c.id).length])];
  else if (tipo === "maisVendidos") linhas = [["Produto", "Unidades vendidas"], ...[...db.produtos].sort((a, b) => b.vendidos - a.vendidos).map(p => [p.nome, p.vendidos])];
  else if (tipo === "desempenho") linhas = [["Produto", "Cliques", "Vendidos", "Conversão"], ...[...db.produtos].sort((a, b) => (db.cliques[b.id] || 0) - (db.cliques[a.id] || 0)).map(p => { const c = db.cliques[p.id] || 0; return [p.nome, c, p.vendidos, (c ? (p.vendidos / c * 100).toFixed(1) : "0,0").replace(".", ",") + "%"]; })];
  else linhas = [["Pedido", "Data", "Cliente", "Status", "Vendedor", "Subtotal", "Frete", "Total", "Pagamento", "Entrega", "Rastreio"], ...db.pedidos.map(p => [numPedido(p.numero), dataBR(p.criadoEm), cliente(p.clienteId).nome, STATUS[p.status], nomeEquipe(p.vendedorId), p.subtotal.toFixed(2).replace(".", ","), p.frete.toFixed(2).replace(".", ","), (p.subtotal + p.frete).toFixed(2).replace(".", ","), p.pagamento.metodo, p.entrega, p.rastreio])];
  const csv = "\uFEFF" + linhas.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `${tipo}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    toast("Arquivo gerado para o Excel.");
  } catch (e) { toast("Exportação indisponível nesta visualização."); }
}

// =====================================================================
//  ROTEADOR
// =====================================================================

function render() {
  const rota = location.hash || "#/";
  const partes = rota.replace(/^#\//, "").split("/").map(decodeURIComponent);
  const scrollAntes = window.scrollY;
  if (partes[0] === "admin") { location.hash = rota.replace("#/admin", "#/painel"); return; }   // endereço antigo

  if (partes[0] === "painel") {
    document.body.className = "admin";
    const [, secao, arg] = partes;

    if (secao === "recuperar") { $("#app").innerHTML = telaRecuperarSenha(); window.scrollTo(0, 0); render._rota = rota; return; }
    if (!painel.sessao) {
      // qualquer página do painel manda para o login; depois de entrar, volta para ela
      painel.voltarPara = secao ? rota : null;
      $("#app").innerHTML = telaLoginPainel(secao ? "Entre com a conta administradora para abrir esta página." : "");
      window.scrollTo(0, 0); render._rota = rota; return;
    }

    const pag = !secao ? adminPainel()
      : secao === "pedidos" ? (arg ? adminPedido(arg) : adminPedidos())
      : secao === "produtos" ? (arg ? adminProdutoForm(arg) : adminProdutos())
      : secao === "categorias" ? adminCategorias() : secao === "clientes" ? adminClientes()
      : secao === "equipe" ? adminEquipe() : secao === "relatorios" ? adminRelatorios()
      : secao === "acessos" ? painelAcessos() : secao === "senha" ? telaTrocarSenha()
      : secao === "pagamentos" ? painelPagamentos() : secao === "aparencia" ? painelAparencia()
      : secao === "loja" ? painelConfiguracoesLoja() : adminPainel();
    $("#app").innerHTML = layoutAdmin(pag, rota);
  } else {
    document.body.className = "loja";
    const [p0, p1, p2] = partes;
    const pag = !p0 ? paginaInicio()
      : p0 === "categorias" ? paginaCategorias()
      : p0 === "categoria" ? paginaCategoria(p1, p2)
      : p0 === "busca" ? paginaBusca(p1 || "")
      : p0 === "produto" ? paginaProduto(p1)
      : p0 === "carrinho" ? paginaCarrinho()
      : p0 === "finalizar" ? paginaFinalizar()
      : p0 === "pedido-confirmado" ? paginaConfirmado(p1)
      : p0 === "entrar" ? paginaEntrar()
      : p0 === "conta" ? paginaConta(p1, p2)
      : paginaInicio();
    $("#app").innerHTML = layoutLoja(pag, rota);
  }
  if (render._rota === rota) window.scrollTo(0, scrollAntes); else window.scrollTo(0, 0);
  render._rota = rota;
}
window.addEventListener("hashchange", render);
render();
