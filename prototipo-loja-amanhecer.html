<style>
/* ===== Tokens da identidade visual ===== */
:root{
  --ametista:#3E2A6E; --ametista-escuro:#2A1B4D; --lilas:#CDBDF0; --lilas-claro:#F4F0FC;
  --ouro:#A8832A; --ouro-claro:#E2C46B; --ouro-palido:#FBF4DF;
  --celeste:#8FD0EA; --celeste-claro:#E8F6FC;
  --branco:#FFFFFF; --tinta:#2B2140; --tinta-suave:#6A5F80; --linha:#E6DFF3;
  --sucesso:#2F7D5B; --alerta:#B5561E; --perigo:#B3263E;
  --serifa:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --raio:14px; --raio-p:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--tinta);background:var(--branco);font-size:16px;line-height:1.5}
img,svg{max-width:100%;display:block}
a{color:var(--ametista)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ouro-claro);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-variant-numeric:lining-nums;font-family:var(--serifa);font-weight:600;line-height:1.15;margin:0 0 .5rem;color:var(--ametista-escuro)}
h1{font-size:clamp(2rem,6vw,3.25rem)} h2{font-size:clamp(1.6rem,4vw,2.1rem)} h3{font-size:1.35rem}
p{margin:0 0 1rem}
.recipiente{width:min(1180px,100% - 32px);margin-inline:auto}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Aviso de protótipo ===== */
.faixa-prototipo{background:var(--ametista-escuro);color:#EDE6FA;font-size:.82rem;padding:6px 0}
.faixa-prototipo .recipiente{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.faixa-prototipo button{background:transparent;border:1px solid #8a79b3;color:#fff;border-radius:99px;padding:3px 12px;cursor:pointer}
.faixa-prototipo button[aria-pressed=true]{background:var(--ouro-claro);color:var(--ametista-escuro);border-color:var(--ouro-claro)}

/* ===== Botões e campos ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;border:1.5px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s}
.btn-principal{background:var(--ametista);color:#fff}
.btn-principal:hover{background:var(--ametista-escuro)}
.btn-ouro{background:var(--ouro-claro);color:var(--ametista-escuro)}
.btn-ouro:hover{background:#d8b651}
.btn-contorno{background:#fff;border-color:var(--lilas);color:var(--ametista)}
.btn-contorno:hover{background:var(--lilas-claro)}
.btn-whats{background:#1f8f53;color:#fff}
.btn-instagram{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);color:#fff}
/* Botão flutuante do WhatsApp: sempre visível, acima da navegação inferior no celular */
.whats-flutuante{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#1f8f53;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:45;text-decoration:none}
.whats-flutuante svg{width:30px;height:30px}
@media (hover:hover) and (pointer:fine){.whats-flutuante{transition:transform .15s ease}.whats-flutuante:hover{transform:scale(1.08)}}
@media (max-width:760px){.whats-flutuante{right:16px;bottom:82px;width:52px;height:52px}}
.btn-perigo{background:#fff;border-color:#e7b9c2;color:var(--perigo)}
.btn-pequeno{min-height:36px;padding:0 14px;font-size:.9rem}
.btn-bloco{width:100%}
.btn-google{background:#fff;border-color:#dadce0;color:#3c4043}
.btn-google:hover{background:#f8f9fa}
.divisor-ou{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--tinta-suave);font-size:.85rem}
.divisor-ou::before,.divisor-ou::after{content:"";flex:1;height:1px;background:var(--linha)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:.9rem;font-weight:600;margin-bottom:4px}
.campo{margin-bottom:14px}
.campo small{color:var(--tinta-suave);font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=search],select,textarea{
  width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--linha);border-radius:var(--raio-p);background:#fff}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ametista);outline:none;box-shadow:0 0 0 3px var(--lilas-claro)}
.grade-campos{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.aviso{padding:12px 14px;border-radius:var(--raio-p);background:var(--celeste-claro);color:#1d4d63;font-size:.92rem;margin-bottom:14px}
.aviso-ouro{background:var(--ouro-palido);color:#6d5313}
.erro{color:var(--perigo);font-size:.88rem;margin-top:4px}

/* ===== Cabeçalho da loja ===== */
.topo{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo .recipiente{display:flex;align-items:center;gap:16px;min-height:66px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ametista-escuro)}
.marca img{width:38px;height:38px}
.marca span{font-family:var(--serifa);font-size:1.45rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
/* Ampliação da marca ao passar o mouse: só em telas com mouse de verdade,
   para não deixar a imagem "grudada" depois de um toque no celular. */
.marca-lupa{position:relative;display:inline-flex}
.marca-lupa .marca-lupa-grande{position:absolute;top:calc(100% + 10px);left:0;width:200px;max-width:none;height:200px;border-radius:50%;object-fit:contain;background:#fff;padding:12px;box-shadow:0 14px 34px rgba(42,27,77,.28);opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;z-index:40}
@media (hover:hover) and (pointer:fine){
  .marca-lupa .marca-lupa-grande{transition:opacity .18s ease,transform .18s ease}
  .marca-lupa:hover .marca-lupa-grande,
  .marca:focus-visible .marca-lupa-grande{opacity:1;visibility:visible;transform:translateY(0)}
}
.busca-topo{flex:1;position:relative;max-width:520px}
.busca-topo input{border-radius:99px;padding-left:44px;background:var(--lilas-claro);border-color:transparent}
.busca-topo svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;color:var(--tinta-suave)}
.acoes-topo{display:flex;gap:6px;margin-left:auto}
.icone-btn{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:99px;border:0;background:transparent;color:var(--ametista);cursor:pointer;text-decoration:none;font-weight:600}
.icone-btn:hover{background:var(--lilas-claro)}
.icone-btn svg{width:22px;height:22px}
.contador{position:absolute;top:4px;left:26px;min-width:18px;height:18px;border-radius:9px;background:var(--ouro-claro);color:var(--ametista-escuro);font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-categorias{border-top:1px solid var(--linha);overflow-x:auto;scrollbar-width:none}
.menu-categorias::-webkit-scrollbar{display:none}
.menu-categorias .recipiente{display:flex;gap:4px;min-height:46px;align-items:center}
.menu-categorias a{white-space:nowrap;text-decoration:none;color:var(--tinta);padding:8px 12px;border-radius:99px;font-size:.93rem}
.menu-categorias a:hover,.menu-categorias a.ativo{background:var(--lilas-claro);color:var(--ametista)}

/* Navegação inferior (celular) */
.nav-inferior{display:none}
@media (max-width:760px){
  .busca-topo,.acoes-topo .rotulo,.menu-categorias{display:none}
  .topo .recipiente{min-height:58px}
  .nav-inferior{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
  .nav-inferior a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:.72rem;color:var(--tinta-suave);text-decoration:none;position:relative}
  .nav-inferior a.ativo{color:var(--ametista);font-weight:700}
  .nav-inferior svg{width:22px;height:22px}
  .nav-inferior .contador{left:calc(50% + 4px);top:2px}
  body.loja{padding-bottom:70px}
}

/* ===== Vitrine da página inicial: a arte da Lojinha do Vale ===== */
.vitrine{position:relative;background:radial-gradient(120% 140% at 50% 0%,#1B1230 0%,#100B1E 55%,#0A0713 100%);padding:26px 0 40px;overflow:hidden}
.vitrine .recipiente{position:relative;z-index:2}
/* a arte entra inteira, na proporção original (nada é cortado nem esticado) */
.vitrine-arte{width:100%;height:auto;aspect-ratio:3982 / 486;border-radius:12px;display:block;
  box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(226,196,107,.35)}
.vitrine-texto{max-width:44rem;margin:26px auto 0;text-align:center}
.vitrine-texto h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.vitrine-texto p{color:#DCD3EE;font-size:1.08rem;margin:0 auto 18px;max-width:34rem}
/* brilho dourado discreto atrás da arte, só para dar profundidade */
.vitrine::after{content:"";position:absolute;left:50%;top:-40%;width:min(900px,120%);aspect-ratio:1;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(226,196,107,.16),transparent 62%);pointer-events:none}
@media (max-width:760px){
  .vitrine{padding:18px 0 30px}
  .vitrine-arte{border-radius:8px}
  .vitrine-texto{margin-top:20px}
  .vitrine-texto p{font-size:1rem}
}
/* ===== Seções e categorias (medalhões) ===== */
.secao{padding:48px 0}
.secao-cabecalho{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px}
.secao-cabecalho a{font-weight:600;text-decoration:none;white-space:nowrap}
.medalhoes{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.medalhao{text-decoration:none;color:var(--tinta);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.medalhao .circulo{width:100%;max-width:150px;aspect-ratio:1;border-radius:50%;padding:6px;background:conic-gradient(from 200deg,var(--ouro-claro),#fff3c9,var(--ouro),var(--ouro-claro));transition:transform .2s}
.medalhao .circulo>div{width:100%;height:100%;border-radius:50%;background:var(--lilas-claro);display:grid;place-items:center;overflow:hidden}
/* Giro da foto da categoria na página inicial: só a imagem dentro do círculo gira.
   A borda dourada, o nome e o resto do card ficam parados. */
@media (hover:hover) and (pointer:fine){
  .medalhoes .medalhao .circulo>div{transition:transform .9s cubic-bezier(.3,0,.2,1)}
  /* uma volta a cada entrada do mouse; ao sair, desfaz o giro suavemente */
  .medalhoes .medalhao:hover .circulo>div,
  .medalhoes .medalhao:focus-visible .circulo>div{transform:rotate(360deg)}
}
@media (prefers-reduced-motion:reduce){
  .medalhoes .medalhao .circulo>div{transition:none}
  .medalhoes .medalhao:hover .circulo>div,
  .medalhoes .medalhao:focus-visible .circulo>div{transform:none}
}
.medalhao .circulo svg{width:92%}
.medalhao:hover .circulo{transform:translateY(-3px)}
.medalhao strong{font-weight:600;font-size:.98rem;line-height:1.25}
@media (max-width:900px){.medalhoes{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.medalhoes{grid-template-columns:repeat(3,1fr);gap:12px}.medalhao strong{font-size:.84rem}}

/* ===== Cartões de produto ===== */
.grade-produtos{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media (max-width:1000px){.grade-produtos{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.grade-produtos{grid-template-columns:repeat(2,1fr);gap:14px}}
.produto-card{display:flex;flex-direction:column;text-decoration:none;color:var(--tinta);position:relative}
.produto-card .produto-link{display:flex;flex-direction:column;text-decoration:none;color:inherit}
/* Navegação entre as fotos do card: aparece ao passar o mouse; no celular fica sempre visível */
.card-fotos-nav{position:absolute;left:0;right:0;top:0;aspect-ratio:1;pointer-events:none}
.card-seta{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(255,255,255,.92);color:var(--ametista);display:grid;place-items:center;cursor:pointer;pointer-events:auto;
  box-shadow:0 2px 8px rgba(42,27,77,.18);opacity:0;transition:opacity .15s}
.card-seta svg{width:18px;height:18px}
.card-seta.anterior{left:8px}.card-seta.proxima{right:8px}
.card-seta[hidden]{display:none}
.produto-card:hover .card-seta,.produto-card:focus-within .card-seta{opacity:1}
.card-pontos{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.card-pontos span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 0 0 1px rgba(42,27,77,.15)}
.card-pontos span.atual{background:var(--ametista);width:14px;border-radius:3px}
@media (hover:none){.card-seta{opacity:1;width:30px;height:30px}}
.produto-card .foto{aspect-ratio:1;border-radius:var(--raio);overflow:hidden;background:var(--lilas-claro);position:relative}
.produto-card .foto svg{width:100%;height:100%}
.produto-card h3{font-family:var(--sans);font-size:.98rem;font-weight:600;color:var(--tinta);margin:10px 0 2px;line-height:1.3}
.produto-card .preco{font-weight:700;color:var(--ametista);font-size:1.05rem}
.produto-card .prazo{font-size:.8rem;color:var(--tinta-suave)}
.selo{position:absolute;left:8px;top:8px;background:#fff;color:var(--ametista);font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:99px}
.selo-encomenda{background:var(--ouro-palido);color:#6d5313}

/* ===== Página de categoria ===== */
.trilha{font-size:.88rem;color:var(--tinta-suave);margin:20px 0 8px}
.trilha a{text-decoration:none}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 22px}
.chip{border:1.5px solid var(--linha);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--tinta)}
.chip.ativo{background:var(--ametista);border-color:var(--ametista);color:#fff}
.filtros select{width:auto;min-height:40px;margin-left:auto;border-radius:99px}
.vazio{text-align:center;padding:48px 16px;color:var(--tinta-suave)}

/* ===== Página do produto ===== */
.produto-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;margin:10px 0 48px}
@media (max-width:860px){.produto-layout{grid-template-columns:1fr;gap:20px}}
.galeria-principal{aspect-ratio:1;border-radius:var(--raio);overflow:hidden;background:var(--lilas-claro)}
.galeria-principal svg{width:100%;height:100%}
.miniaturas{display:flex;gap:10px;margin-top:10px}
.miniaturas button{width:72px;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--lilas-claro);cursor:pointer}
.miniaturas button[aria-current=true]{border-color:var(--ouro)}
.miniaturas svg{width:100%;height:100%}
.preco-grande{font-size:1.9rem;font-weight:700;color:var(--ametista);margin:6px 0 2px}

.opcao-grupo .valores{display:flex;flex-wrap:wrap;gap:8px}
.opcao-grupo button{min-width:48px;min-height:42px;padding:0 14px;border-radius:10px;border:1.5px solid var(--linha);background:#fff;cursor:pointer}
.opcao-grupo button[aria-pressed=true]{border-color:var(--ametista);background:var(--lilas-claro);color:var(--ametista);font-weight:600}
.opcao-grupo button:disabled{text-decoration:line-through;opacity:.45}
.quantidade{display:inline-flex;align-items:center;border:1.5px solid var(--linha);border-radius:99px;overflow:hidden}
.quantidade button{width:42px;height:42px;border:0;background:#fff;font-size:1.2rem;cursor:pointer;color:var(--ametista)}
.quantidade span{min-width:34px;text-align:center;font-weight:600}
.caixa-prazo{border:1px solid var(--linha);border-radius:var(--raio);padding:16px;margin:18px 0}
.caixa-prazo dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:.94rem}
.caixa-prazo dt{color:var(--tinta-suave)} .caixa-prazo dd{margin:0;font-weight:600;text-align:right}
.caixa-prazo .total{border-top:1px dashed var(--linha);padding-top:8px;color:var(--ametista)}
.linha-cep{display:flex;gap:8px}
.linha-cep input{max-width:170px}
.descricao{max-width:65ch;color:#433a55}
.acoes-produto{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
@media (max-width:760px){.barra-compra{position:fixed;left:0;right:0;bottom:62px;z-index:35;background:#fff;border-top:1px solid var(--linha);padding:10px 16px;display:flex;gap:10px;align-items:center}.barra-compra .btn{flex:1}}

/* ===== Carrinho / checkout ===== */
.carrinho-layout{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start;margin:20px 0 48px}
@media (max-width:900px){.carrinho-layout{grid-template-columns:1fr}}
.item-carrinho{display:grid;grid-template-columns:88px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--linha)}
.item-carrinho .foto{width:88px;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--lilas-claro)}
.item-carrinho .foto svg{width:100%;height:100%}
.item-carrinho .meta{font-size:.86rem;color:var(--tinta-suave)}
.link-remover{background:none;border:0;color:var(--perigo);cursor:pointer;padding:0;font-size:.86rem;text-decoration:underline}
.resumo{border:1px solid var(--linha);border-radius:var(--raio);padding:20px;position:sticky;top:130px;background:#fff}
.resumo .linha{display:flex;justify-content:space-between;margin:6px 0}
.resumo .total{font-size:1.25rem;font-weight:700;color:var(--ametista);border-top:1px solid var(--linha);padding-top:10px;margin-top:10px}
.opcao-frete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--linha);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opcao-frete:has(input:checked){border-color:var(--ametista);background:var(--lilas-claro)}
.opcao-frete input{accent-color:var(--ametista);width:18px;height:18px}
.opcao-frete .desc{flex:1;font-size:.9rem;line-height:1.3}
.opcao-frete .desc small{display:block;color:var(--tinta-suave)}
.etapas{display:flex;gap:6px;margin:20px 0 6px;font-size:.86rem;list-style:none;padding:0;counter-reset:e}
.etapas li{flex:1;padding:8px 0;border-top:3px solid var(--linha);color:var(--tinta-suave);counter-increment:e}
.etapas li::before{content:counter(e) ". "}
.etapas li.feita{border-color:var(--ouro-claro);color:var(--tinta)} .etapas li.atual{border-color:var(--ametista);color:var(--ametista);font-weight:700}
.bloco{border:1px solid var(--linha);border-radius:var(--raio);padding:20px;margin-bottom:18px}
.confirmacao{text-align:center;max-width:560px;margin:40px auto 60px}
.confirmacao .numero{font-family:var(--serifa);font-variant-numeric:lining-nums;font-size:2.4rem;color:var(--ametista);font-weight:700;margin:4px 0 12px}
.pix{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;text-align:left;background:var(--lilas-claro);border-radius:var(--raio);padding:16px;margin:18px 0}
.pix code{word-break:break-all;font-size:.78rem;display:block;background:#fff;padding:8px;border-radius:6px;margin:6px 0}

/* ===== Conta ===== */
.conta-layout{display:grid;grid-template-columns:220px 1fr;gap:32px;margin:24px 0 48px}
@media (max-width:760px){.conta-layout{grid-template-columns:1fr;gap:12px}}
.menu-lateral{display:flex;flex-direction:column;gap:4px}

.menu-lateral a.ativo{background:var(--lilas-claro);color:var(--ametista);font-weight:600}
.entrar{max-width:430px;margin:36px auto 56px}
.abas{display:flex;border-bottom:1px solid var(--linha);margin-bottom:20px}
.abas button{flex:1;background:none;border:0;padding:12px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;color:var(--tinta-suave)}
.abas button[aria-selected=true]{border-color:var(--ametista);color:var(--ametista)}
.pedido-linha{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.st-PedidoRecebido{background:#EEE9F8;color:#4b3c7a}.st-AguardandoPagamento{background:var(--ouro-palido);color:#6d5313}
.st-PagamentoConfirmado{background:var(--celeste-claro);color:#1d4d63}.st-EmProducao{background:#F3E6FA;color:#6b2e8a}
.st-ProntoParaEnvio{background:#E4F1FF;color:#23518a}.st-Enviado{background:#E3F4EE;color:#1f6a4c}
.st-Entregue{background:#DDEFE4;color:#1b5e3d}.st-Cancelado{background:#FBE9EC;color:var(--perigo)}
.linha-tempo{list-style:none;padding:0;margin:14px 0}

.linha-tempo li::before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--linha)}
.linha-tempo li::after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--linha)}

.linha-tempo small{display:block;color:var(--tinta-suave)}

.metricas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}

.tabela-rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--tinta-suave);padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr.clicavel{cursor:pointer} tr.clicavel:hover td{background:var(--lilas-claro)}
.mini-foto{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--lilas-claro)}
.mini-foto svg{width:100%;height:100%}
.interruptor{position:relative;width:44px;height:26px;border-radius:13px;border:0;background:#cfc8dc;cursor:pointer;flex:none}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.interruptor[aria-checked=true]{background:var(--sucesso)} .interruptor[aria-checked=true]::after{left:21px}
.barra-filtro{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.barra-filtro input,.barra-filtro select{width:auto;min-width:180px;min-height:40px}
.pedido-admin>*,.duas-colunas>*,.carrinho-layout>*,.produto-layout>*,.conta-layout>*{min-width:0}
.pedido-admin{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
@media (max-width:1000px){.pedido-admin{grid-template-columns:1fr}}
.dados-lista{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem;margin:0}
.dados-lista dt{color:var(--tinta-suave)}.dados-lista dd{margin:0}
.fotos-edicao{display:flex;gap:10px;flex-wrap:wrap}
.fotos-edicao .foto{width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--lilas-claro);position:relative}
.fotos-edicao .foto svg{width:100%;height:100%}
.fotos-edicao .foto span{position:absolute;bottom:4px;left:4px;background:#fff;font-size:.68rem;padding:1px 6px;border-radius:99px}
.fotos-edicao .adicionar{border:2px dashed var(--lilas);display:grid;place-items:center;color:var(--ametista);font-size:.8rem;text-align:center;cursor:pointer;background:#fff}
.galeria-produto{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.galeria-item{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff}
.galeria-item.capa{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro)}
.galeria-item .imagem{aspect-ratio:1;background:var(--lilas-claro);position:relative}
.galeria-item .imagem img,.galeria-item .imagem svg{width:100%;height:100%;object-fit:cover;display:block}
.galeria-item .selo-capa{position:absolute;left:8px;top:8px;background:var(--ouro-claro);color:var(--ametista-escuro);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
.galeria-item .acoes{display:flex;gap:4px;padding:8px;flex-wrap:wrap;justify-content:center}
.galeria-item .acoes button{min-height:32px;padding:0 10px;font-size:.82rem;border-radius:99px;border:1.5px solid var(--linha);background:#fff;cursor:pointer;color:var(--ametista)}
.galeria-item .acoes button:hover{background:var(--lilas-claro)}
.galeria-item .acoes button.excluir{color:var(--perigo);border-color:#e7b9c2}
.galeria-item .acoes button:disabled{opacity:.45;cursor:not-allowed}
.galeria-vazia{border:2px dashed var(--lilas);border-radius:12px;padding:18px;text-align:center;color:var(--tinta-suave);background:var(--lilas-claro)}
.envio-fotos{border:2px dashed var(--lilas);border-radius:var(--raio);padding:16px;text-align:center;background:var(--lilas-claro);margin-bottom:12px}
.envio-fotos.arrastando{border-color:var(--ouro);background:var(--ouro-palido)}
.envio-fotos p{margin:6px 0 10px;color:var(--tinta-suave);font-size:.9rem}
.envio-botoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fila-envio{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.envio-item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:8px}
.envio-item .previa{width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--lilas-claro);display:grid;place-items:center;font-size:.62rem;color:var(--tinta-suave);text-align:center}
.envio-item .previa img{width:100%;height:100%;object-fit:cover}
.envio-item .nome{display:block;font-size:.86rem;font-weight:600;word-break:break-all;line-height:1.2}
.envio-item .detalhe{display:block;font-size:.78rem;color:var(--tinta-suave)}
.barra-progresso{height:6px;border-radius:3px;background:var(--lilas-claro);overflow:hidden;margin-top:6px}
.barra-progresso div{height:100%;width:0;background:var(--ametista);transition:width .2s}
.envio-item.pronto .barra-progresso div{background:var(--sucesso)}
.envio-item.erro{border-color:#e7b9c2}
.envio-item.erro .barra-progresso div{background:var(--perigo)}
.envio-situacao{font-size:.78rem;font-weight:600;white-space:nowrap}
.variacoes-tabela input{min-height:38px;padding:6px 10px}
.arvore li{list-style:none;padding:8px 0;border-bottom:1px solid var(--linha)}
.foto-cat{width:52px;height:52px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--ouro-claro),#fff3c9,var(--ouro),var(--ouro-claro));flex:none}
.foto-cat>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--lilas-claro);display:grid;place-items:center}
.foto-cat img{width:100%;height:100%;object-fit:cover}
.foto-cat svg{width:92%}
.acoes-foto{display:flex;gap:6px;flex-wrap:wrap}
.chip .mini-cat{width:24px;height:24px;border-radius:50%;object-fit:cover;margin-right:6px;vertical-align:-7px;border:1.5px solid var(--ouro-claro)}
.recorte-area{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:0 auto;border-radius:50%;overflow:hidden;background:#241a3d;touch-action:none;cursor:grab}
.recorte-area.arrastando{cursor:grabbing}
.recorte-area img{position:absolute;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.recorte-moldura{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 3px var(--ouro-claro) inset;pointer-events:none}
.recorte-controles{display:flex;align-items:center;gap:10px;margin:14px 0}
.recorte-controles input[type=range]{flex:1;accent-color:var(--ametista)}
.arvore ul{padding-left:22px;margin:6px 0 0}
.arvore .linha-cat{display:flex;align-items:center;gap:10px;justify-content:space-between}
.grafico-barras{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.grafico-barras .barra{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.78rem;color:var(--tinta-suave)}
.grafico-barras .barra div{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--ametista),#7a62b3)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ametista-escuro);color:#fff;padding:12px 20px;border-radius:99px;z-index:100;font-size:.93rem;box-shadow:0 8px 24px rgba(42,27,77,.25)}
dialog{border:0;border-radius:var(--raio);padding:22px;max-width:480px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(42,27,77,.45)}
</style>
</head>
<body class="loja">
<div class="faixa-prototipo" role="note">
  <div class="recipiente">
    <span>Protótipo para aprovação · dados e produtos fictícios · pagamento e frete simulados</span>
    <span>Painel do administrador: abra <a href="#/painel" style="color:#E2C46B">#/painel</a> (na versão final, <code>/painel</code>)</span>
  </div>
</div>
<div id="app"></div>
<div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

<dialog id="janelaRecorte" aria-labelledby="tituloRecorte">
  <h3 id="tituloRecorte" style="margin-top:0">Enquadrar a foto da categoria</h3>
  <p style="margin:0 0 10px;color:var(--tinta-suave);font-size:.9rem">Arraste a foto e use o controle para aproximar. O que aparecer dentro do círculo é o que a loja vai mostrar.</p>
  <div class="recorte-area" id="recorteArea"
       onmousedown="arrastarRecorte(event,'inicio')" onmousemove="arrastarRecorte(event)" onmouseup="arrastarRecorte(event,'fim')" onmouseleave="arrastarRecorte(event,'fim')"
       ontouchstart="arrastarRecorte(event,'inicio')" ontouchmove="arrastarRecorte(event)" ontouchend="arrastarRecorte(event,'fim')"></div>
  <div class="recorte-controles">
    <label for="recorteZoom" style="margin:0">Aproximar</label>
    <input id="recorteZoom" type="range" min="1" max="3" step="0.01" value="1" oninput="zoomRecorte(this.value)">
  </div>
  <p id="recorteNome" style="margin:0;font-size:.86rem;font-weight:600;word-break:break-all"></p>
  <p id="recorteInfo" style="margin:2px 0 0;font-size:.82rem;color:var(--tinta-suave)"></p>
  <p id="recorteAviso" class="erro"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn btn-contorno btn-pequeno" type="button" onclick="document.getElementById('janelaRecorte').close()">Cancelar</button>
    <button class="btn btn-principal btn-pequeno" id="recorteSalvar" type="button" onclick="salvarFotoCategoria()">Salvar foto</button>
  </div>
</dialog>

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("oculto");

/// Sempre quadrada e redonda, sem esticar: mesma proporção do arquivo original.
function marcaImg(tamanho = 38, estilo = "") {
  return `<img src="${MARCA_URL}" alt="Lojinha Do Vale" width="${tamanho}" height="${tamanho}" decoding="async"
    style="width:${tamanho}px;height:${tamanho}px;border-radius:50%;object-fit:contain;flex:none;${estilo}">`;
}

// Ícone do cabeçalho com a versão ampliada por trás, revelada só no CSS (.marca-lupa:hover)
function marcaImgComLupa(tamanho = 38, estilo = "") {
  return `<span class="marca-lupa">${marcaImg(tamanho, estilo)}<img class="marca-lupa-grande" src="${MARCA_URL}" alt="Lojinha Do Vale" width="200" height="200" loading="lazy" decoding="async"></span>`;
}

// ---------- Ilustrações provisórias dos produtos (serão trocadas pelas fotos reais) ----------
function arte(tipo, cor = "#6b4fa8", variante = 0) {
  const fundo = ["#F4F0FC", "#E8F6FC", "#FBF4DF"][variante % 3];
  const ouro = "#D4B04F", ouroE = "#A8832A";
  const g = {
    broche: `<ellipse cx="100" cy="100" rx="52" ry="60" fill="${ouro}"/><ellipse cx="100" cy="100" rx="44" ry="52" fill="${ouroE}"/>

/* Categoria está no ar quando ela e (se for subcategoria) a categoria pai estão ativas.
   A loja só mostra o que está no ar; o painel mostra tudo. */
function categoriaAtiva(id) {
  const { cat, pai } = categoriaPorId(id);
  if (!cat) return false;
  return cat.ativa !== false && (!pai || pai.ativa !== false);
}
const categoriasDaLoja = () => db.categorias.filter(c => c.ativa !== false);
const subsDaLoja = c => c.subs.filter(sc => sc.ativa !== false);
/* Produtos que a loja pode exibir: ativos e em categoria ativa. */
const produtosDaLoja = () => db.produtos.filter(p => p.ativo && categoriaAtiva(p.categoria));

function categoriaPorId(id) {
  for (const c of db.categorias) {
    if (c.id === id) return { cat: c, pai: null };
    const s = c.subs.find(s => s.id === id); if (s) return { cat: s, pai: c };
  }
  return { cat: null, pai: null };
}
function categoriaRaiz(p) { const { cat, pai } = categoriaPorId(p.categoria); return pai || cat; }
function arteProduto(p, foto = 0) { const r = categoriaRaiz(p); return arte(r?.arte || "outros", p.cor, foto); }

/* Conteúdo do medalhão: a foto cadastrada, ou a ilustração padrão quando não houver foto.

function medalhaoConteudo(c) {
  return c.foto
    ? `<img src="${c.foto}" alt="${esc(c.nome)}">`
    : arte(c.arte || "outros", c.cor || "#6b4fa8");
}
function estoqueTotal(p) { return p.variacoes.length ? p.variacoes.reduce((s, v) => s + v.estoque, 0) : p.estoque; }
function precoVar(p, v) { return v?.preco ?? p.preco; }

/* Regra aprovada: prazo = produção + transporte.
   Sob encomenda sempre produz; pronta entrega só produz se faltar estoque. */
function prazoProducaoItem(p, v, qtd) {
  if (p.disponibilidade === "SobEncomenda") return p.prazoProducao;
  const est = v ? v.estoque : p.estoque;
  return qtd <= est ? 0 : (p.prazoProducao || 7);
}
function textoDisponibilidade(p) {
  return p.disponibilidade === "SobEncomenda" ? `Sob encomenda · produção em até ${diasUteis(p.prazoProducao)}`
    : estoqueTotal(p) > 0 ? "Pronta entrega" : `Produção em até ${diasUteis(p.prazoProducao || 7)}`;
}

const UF_POR_FAIXA = [[1,19,"SP"],[20,28,"RJ"],[29,29,"ES"],[30,39,"MG"],[40,48,"BA"],[49,49,"SE"],[50,56,"PE"],[57,57,"AL"],[58,58,"PB"],[59,59,"RN"],[60,63,"CE"],[64,64,"PI"],[65,65,"MA"],[66,68,"PA"],[69,69,"AM"],[70,73,"DF"],[74,76,"GO"],[77,77,"TO"],[78,78,"MT"],[79,79,"MS"],[80,87,"PR"],[88,89,"SC"],[90,99,"RS"]];
function ufDoCep(cep) { const f = +soDigitos(cep).slice(0, 2); return (UF_POR_FAIXA.find(([a, b]) => f >= a && f <= b) || [0, 0, "SP"])[2]; }

async function consultarCep(cep) {
  const c = soDigitos(cep);
  if (c.length !== 8) return null;
  try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 3500);
    const r = await fetch(`https://viacep.com.br/ws/${c}/json/`, { signal: ctrl.signal });
    const j = await r.json();
    if (!j.erro) return { cep: fmtCep(c), logradouro: j.logradouro, bairro: j.bairro, cidade: j.localidade, uf: j.uf };
  } catch (e) { /* sem internet: segue com simulação */ }
  return { cep: fmtCep(c), logradouro: "", bairro: "", cidade: "", uf: ufDoCep(c), simulado: true };
}

function cotarFrete(cep, itens) {
  const uf = ufDoCep(cep);
  const distancia = { DF: 0, GO: 1, MG: 2, MT: 2, MS: 2, TO: 2, BA: 2, SP: 2, RJ: 3, ES: 3, PR: 3, SC: 3, RS: 4 }[uf] ?? 4;

  const opcoes = [
    { id: 1, nome: "Correios PAC", valor: 16.9 + distancia * 4.2 + pesoKg * 5.5, prazo: 3 + distancia * 2 },
    { id: 2, nome: "Correios SEDEX", valor: 27.5 + distancia * 6.8 + pesoKg * 8.9, prazo: 1 + distancia },
    { id: 3, nome: "Jadlog .Package", valor: 19.9 + distancia * 3.9 + pesoKg * 5.1, prazo: 2 + distancia * 2 }
  ];
  if (uf === "DF" || uf === "GO") opcoes.push({ id: 0, nome: "Retirada no local", valor: 0, prazo: 0, detalhe: "Combine o horário pelo WhatsApp" });
  return opcoes.map(o => ({ ...o, valor: Math.round(o.valor * 100) / 100 }));
}

const estado = { cep: "", fretes: [], freteId: null, busca: "" };

function itensCarrinho() {
  return db.carrinho.map(i => {
    const produto = db.produtos.find(p => p.id === i.produtoId);
    const variacao = i.variacaoIdx == null ? null : produto.variacoes[i.variacaoIdx];
    const unit = precoVar(produto, variacao) + (i.personalizacao ? produto.personalizacao.valor : 0);
    return { ...i, produto, variacao, unit, total: unit * i.qtd, prazo: prazoProducaoItem(produto, variacao, i.qtd) };
  });
}
function qtdCarrinho() { return db.carrinho.reduce((s, i) => s + i.qtd, 0); }
function freteEscolhido() { return estado.fretes.find(f => f.id === estado.freteId) || null; }
function totais() {
  const itens = itensCarrinho();
  const subtotal = itens.reduce((s, i) => s + i.total, 0);
  const frete = freteEscolhido();
  const producao = Math.max(0, ...itens.map(i => i.prazo));
  return { itens, subtotal, frete, producao, total: subtotal + (frete?.valor || 0), prazoTotal: frete ? producao + frete.prazo : null };
}

// Foto atual de cada card (fica guardada ao voltar para a página)
const fotoDoCard = {};

/* Imagem padrão da loja, usada quando o produto fica sem nenhuma foto. */
function imagemPadraoLoja(nome = "") {
  return `<div style="width:100%;height:100%;display:grid;place-items:center;gap:6px;background:var(--lilas-claro);text-align:center">
    <img src="${MARCA_URL}" alt="${esc(nome)}" style="width:48%;max-width:120px;opacity:.9;border-radius:50%">

}

/* Cada foto do produto vira um item da galeria. As fotos antigas dos produtos de exemplo
   entram como ilustração; as enviadas pelo painel, como imagem. */
function galeriaDoProduto(p) {
  if (Array.isArray(p.galeria)) return p.galeria;
  const itens = Array.from({ length: Math.max(0, p.fotos) }, (_, i) => ({ id: `arte-${p.id}-${i}`, tipo: "arte", indice: i, nome: `Foto ${i + 1}` }));
  (p.arquivos || []).filter(a => a.situacao === "pronto" && a.previa)
    .forEach(a => itens.push({ id: `arq-${a.id}`, tipo: "previa", previa: a.previa, nome: a.nome }));
  return itens;
}

function htmlDaFoto(p, item) {
  return item.tipo === "previa"
    ? `<img src="${item.previa}" alt="${esc(p.nome)}" loading="lazy" style="width:100%;height:100%;object-fit:cover">`
    : arteProduto(p, item.indice ?? 0);
}

/* Fotos do produto na ordem do cadastro; sem nenhuma, entra a imagem padrão da loja.
   Na versão final vem da lista "fotos" de GET /api/produtos (versões de miniatura/catálogo). */
function fotosDoProduto(p) {
  const itens = galeriaDoProduto(p);
  return itens.length ? itens.map(i => htmlDaFoto(p, i)) : [imagemPadraoLoja(p.nome)];
}

const setaSvg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

function cardProduto(p) {
  const encomenda = p.disponibilidade === "SobEncomenda";
  const aPartir = p.variacoes.some(v => v.preco != null && v.preco < p.preco);
  const menor = Math.min(p.preco, ...p.variacoes.map(v => v.preco ?? p.preco));
  const fotos = fotosDoProduto(p);
  const atual = Math.min(fotoDoCard[p.id] || 0, fotos.length - 1);
  const varias = fotos.length > 1;
  return `<div class="produto-card" id="card-${p.id}">
    <a class="produto-link" href="#/produto/${p.slug}">
      <div class="foto" ${varias ? `ontouchstart="toqueCard(event,${p.id},'inicio')" ontouchend="toqueCard(event,${p.id},'fim')"` : ""}>
        <span class="card-foto-atual">${fotos[atual]}</span>
        ${encomenda ? '<span class="selo selo-encomenda">Sob encomenda</span>' : estoqueTotal(p) > 0 && estoqueTotal(p) <= 3 ? '<span class="selo">Últimas unidades</span>' : ""}
        ${varias ? `<span class="card-pontos" aria-hidden="true">${fotos.map((_, i) => `<span class="${i === atual ? "atual" : ""}"></span>`).join("")}</span>` : ""}
      </div>
      <h3>${esc(p.nome)}</h3>
      <div class="preco">${aPartir ? "a partir de " : ""}${brl(menor)}</div>
      <div class="prazo">${encomenda ? `Produção em até ${diasUteis(p.prazoProducao)}` : estoqueTotal(p) > 0 ? "Pronta entrega" : "Sob produção"}</div>
    </a>
    ${varias ? `<div class="card-fotos-nav">
      <button type="button" class="card-seta anterior" aria-label="Foto anterior de ${esc(p.nome)}" ${atual === 0 ? "hidden" : ""} onclick="trocarFotoCard(event,${p.id},-1)">${setaSvg("M15 18l-6-6 6-6")}</button>
      <button type="button" class="card-seta proxima" aria-label="Próxima foto de ${esc(p.nome)}" ${atual === fotos.length - 1 ? "hidden" : ""} onclick="trocarFotoCard(event,${p.id},1)">${setaSvg("M9 18l6-6-6-6")}</button>
    </div>` : ""}
  </div>`;
}

/* Troca só a foto do card, sem redesenhar a página (não perde a rolagem).
   As setas são contextuais: some a "anterior" na primeira foto e a "próxima" na última. */
function trocarFotoCard(evento, id, passo) {
  if (evento) { evento.preventDefault(); evento.stopPropagation(); }
  const p = db.produtos.find(x => x.id === id);
  const card = document.getElementById(`card-${id}`);
  if (!p || !card) return;
  const fotos = fotosDoProduto(p);
  const atual = Math.max(0, Math.min(fotos.length - 1, (fotoDoCard[id] || 0) + passo));
  if (atual === (fotoDoCard[id] || 0) && evento) return;
  fotoDoCard[id] = atual;
  card.querySelector(".card-foto-atual").innerHTML = fotos[atual];
  card.querySelectorAll(".card-pontos span").forEach((ponto, i) => ponto.classList.toggle("atual", i === atual));
  const anterior = card.querySelector(".card-seta.anterior"), proxima = card.querySelector(".card-seta.proxima");
  anterior.hidden = atual === 0;
  proxima.hidden = atual === fotos.length - 1;
  // mantém o foco no teclado quando a seta usada some
  if (document.activeElement && document.activeElement.hidden) (anterior.hidden ? proxima : anterior).focus();
}

// Deslizar o dedo sobre a foto também troca (o toque simples continua abrindo o produto)
const toqueInicio = {};
function toqueCard(evento, id, fase) {
  const t = evento.changedTouches[0];
  if (fase === "inicio") { toqueInicio[id] = { x: t.clientX, y: t.clientY }; return; }
  const i = toqueInicio[id]; if (!i) return;
  const dx = t.clientX - i.x, dy = t.clientY - i.y;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    evento.preventDefault();   // foi um deslize, não um toque: não abre o produto
    trocarFotoCard(null, id, dx < 0 ? 1 : -1);
  }
  delete toqueInicio[id];
}

function ordenar(lista, ordem) {
  const l = [...lista];
  if (ordem === "menor") l.sort((a, b) => a.preco - b.preco);
  else if (ordem === "maior") l.sort((a, b) => b.preco - a.preco);
  else if (ordem === "vendidos") l.sort((a, b) => b.vendidos - a.vendidos);
  else l.sort((a, b) => (b.destaque - a.destaque) || a.nome.localeCompare(b.nome));
  return l;
}

        <div class="valores">${o.valores.map(val => {
          const semEstoque = !encomenda && p.variacoes.length && p.opcoes.length === 1 && (p.variacoes.find(x => x.attrs[o.nome] === val)?.estoque ?? 0) === 0 && !p.prazoProducao;
          return `<button type="button" aria-pressed="${sel.escolhas[o.nome] === val}" ${semEstoque ? "disabled title='Esgotado'" : ""} onclick="sel.escolhas['${esc(o.nome)}']='${esc(val)}';sel.cotacaoProduto=null;render()">${esc(val)}</button>`;
        }).join("")}</div>
      </div>`).join("")}

      ${p.personalizacao ? `<div class="campo" style="margin-top:18px">
        <label for="pers">${esc(p.personalizacao.rotulo)} <small>(opcional, + ${brl(p.personalizacao.valor)})</small></label>
        <input id="pers" type="text" maxlength="${p.personalizacao.limite}" value="${esc(sel.personalizacao)}" placeholder="Como deve ficar escrito"
          oninput="sel.personalizacao=this.value.toUpperCase();this.value=sel.personalizacao;document.getElementById('persN').textContent=this.value.length" onchange="render()">
        <small style="color:var(--tinta-suave)"><span id="persN">${sel.personalizacao.length}</span>/${p.personalizacao.limite} caracteres. Confira a grafia antes de finalizar.</small>
      </div>` : ""}

      <div class="acoes-produto">
        <div class="quantidade" aria-label="Quantidade">
          <button type="button" aria-label="Diminuir" onclick="sel.qtd=Math.max(1,sel.qtd-1);render()">−</button><span>${sel.qtd}</span>
          <button type="button" aria-label="Aumentar" onclick="sel.qtd++;render()">+</button>
        </div>
        <div class="barra-compra" style="flex:1;display:flex">
          <button class="btn btn-principal" style="flex:1" type="button" onclick="adicionarAoCarrinho(${p.id})">${faltaEscolher.length ? `Escolha ${faltaEscolher[0].toLowerCase()}` : "Adicionar ao carrinho"}</button>
        </div>
      </div>

      <div class="caixa-prazo">
        <label for="cepP">Calcular frete e prazo</label>
        <div class="linha-cep">
          <input id="cepP" type="text" inputmode="numeric" placeholder="00000-000" value="${esc(sel.cepProduto)}" oninput="this.value=fmtCep(this.value);sel.cepProduto=this.value">
          <button class="btn btn-contorno" type="button" onclick="cotarNoProduto(${p.id})">Calcular</button>
        </div>
        ${cot ? `<dl style="margin-top:12px">
          <dt>Produção</dt><dd>${producao ? diasUteis(producao) : "Pronta entrega"}</dd>
          <dt>Transporte (${esc(maisBarato.nome)})</dt><dd>${diasUteis(maisBarato.prazo)} · ${brl(maisBarato.valor)}</dd>
          <dt class="total">Receba em até</dt><dd class="total">${diasUteis(producao + maisBarato.prazo)}</dd>
        </dl><small style="color:var(--tinta-suave)">Outras opções de entrega aparecem no carrinho.</small>` : ""}
      </div>

      <h3>Descrição</h3>
      <p class="descricao">${esc(p.descricao)}</p>
      <p style="font-size:.88rem;color:var(--tinta-suave)">Peso ${p.peso} g · Embalagem ${p.dim.join(" × ")} cm</p>
    </div>
  </div>
  ${(() => { const rel = db.produtos.filter(x => x.ativo && x.id !== p.id && categoriaRaiz(x) === categoriaRaiz(p)).slice(0, 4);
    return rel.length ? `<section class="secao" style="padding-top:0"><h2>Da mesma categoria</h2><div class="grade-produtos">${rel.map(cardProduto).join("")}</div></section>` : ""; })()}
  </div>`;
}

function cotarNoProduto(id) {
  if (soDigitos(sel.cepProduto).length !== 8) return toast("Digite um CEP com 8 números.");
  const p = db.produtos.find(x => x.id === id);
  sel.cotacaoProduto = cotarFrete(sel.cepProduto, [{ produto: p, qtd: sel.qtd }]);
  render();
}

function adicionarAoCarrinho(id) {
  const p = db.produtos.find(x => x.id === id);
  const falta = p.opcoes.find(o => !sel.escolhas[o.nome]);
  if (falta) return toast(`Escolha ${falta.nome.toLowerCase()} para continuar.`);
  const { idx } = variacaoSelecionada(p);
  const existente = db.carrinho.find(i => i.produtoId === id && i.variacaoIdx === idx && i.personalizacao === sel.personalizacao);
  if (existente) existente.qtd += sel.qtd;
  else db.carrinho.push({ chave: Date.now(), produtoId: id, variacaoIdx: idx, qtd: sel.qtd, personalizacao: sel.personalizacao });
  estado.fretes = []; estado.freteId = null;
  if (sel.cepProduto && !estado.cep) estado.cep = sel.cepProduto;
  toast("Produto adicionado ao carrinho.");
  render();
}

// ----- Carrinho -----
function blocoFrete(permitirRecalculo = true) {
  const t = totais();
  return `<div class="campo" style="margin-top:14px">
    <label for="cepC">CEP de entrega</label>
    <div class="linha-cep">
      <input id="cepC" type="text" inputmode="numeric" placeholder="00000-000" value="${esc(estado.cep)}" oninput="this.value=fmtCep(this.value);estado.cep=this.value" ${permitirRecalculo ? "" : "readonly"}>
      ${permitirRecalculo ? `<button class="btn btn-contorno" type="button" onclick="calcularFreteCarrinho()">Calcular</button>` : ""}
    </div>
  </div>
  ${estado.fretes.map(f => `<label class="opcao-frete">
      <input type="radio" name="frete" value="${f.id}" ${f.id === estado.freteId ? "checked" : ""} onchange="estado.freteId=${f.id};render()">
      <span class="desc">${esc(f.nome)}<small>${f.id === 0 ? f.detalhe : `Transporte: ${diasUteis(f.prazo)}`} · receba em até ${diasUteis(t.producao + f.prazo)}</small></span>
      <strong>${f.valor ? brl(f.valor) : "Grátis"}</strong>
    </label>`).join("")}`;
}

function calcularFreteCarrinho() {
  if (soDigitos(estado.cep).length !== 8) return toast("Digite um CEP com 8 números.");
  estado.fretes = cotarFrete(estado.cep, itensCarrinho());
  estado.freteId = estado.fretes.slice().sort((a, b) => a.valor - b.valor).find(f => f.id !== 0).id;
  render();
}

function resumoValores(botao) {
  const t = totais();
  return `<aside class="resumo" aria-label="Resumo do pedido">
    <h3>Resumo</h3>
    <div class="linha"><span>Subtotal (${qtdCarrinho()} ${qtdCarrinho() === 1 ? "item" : "itens"})</span><span>${brl(t.subtotal)}</span></div>
    <div class="linha"><span>Frete</span><span>${t.frete ? (t.frete.valor ? brl(t.frete.valor) : "Grátis") : "—"}</span></div>
    ${t.frete ? `<div class="aviso" style="margin:10px 0 0">Produção: <strong>${t.producao ? diasUteis(t.producao) : "pronta entrega"}</strong><br>Transporte: <strong>${diasUteis(t.frete.prazo)}</strong><br>Prazo total: <strong>até ${diasUteis(t.prazoTotal)}</strong></div>` : ""}
    <div class="linha total"><span>Total</span><span>${brl(t.total)}</span></div>
    ${botao}
  </aside>`;
}

function paginaCarrinho() {
  const itens = itensCarrinho();
  if (!itens.length) return `<div class="recipiente vazio" style="padding:64px 16px"><h1 style="font-size:2rem">Seu carrinho está vazio</h1><p>Explore as categorias e escolha seus artigos.</p><a class="btn btn-principal" href="#/categorias">Ver categorias</a></div>`;
  return `<div class="recipiente">
  <h1 style="font-size:2.2rem;margin-top:24px">Carrinho</h1>
  <div class="carrinho-layout">
    <div>
      ${itens.map(i => `<div class="item-carrinho">
        <a class="foto" href="#/produto/${i.produto.slug}">${arteProduto(i.produto)}</a>
        <div>
          <strong>${esc(i.produto.nome)}</strong>
          <div class="meta">${i.variacao ? Object.entries(i.variacao.attrs).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(" · ") : ""}</div>
          ${i.personalizacao ? `<div class="meta">${esc(i.produto.personalizacao.rotulo)}: <strong>${esc(i.personalizacao)}</strong></div>` : ""}
          <div class="meta">${i.prazo ? `Produção em até ${diasUteis(i.prazo)}` : "Pronta entrega"}</div>
          <div style="display:flex;gap:14px;align-items:center;margin-top:8px">
            <div class="quantidade"><button type="button" aria-label="Diminuir" onclick="alterarQtd(${i.chave},-1)">−</button><span>${i.qtd}</span><button type="button" aria-label="Aumentar" onclick="alterarQtd(${i.chave},1)">+</button></div>
            <button class="link-remover" type="button" onclick="removerItem(${i.chave})">Remover</button>
          </div>
        </div>
        <div style="text-align:right"><strong>${brl(i.total)}</strong><div class="meta">${brl(i.unit)} cada</div></div>
      </div>`).join("")}
      <a href="#/categorias" style="display:inline-block;margin-top:16px">Continuar comprando</a>
    </div>
    ${resumoValores(`${blocoFrete()}<button class="btn btn-principal btn-bloco" style="margin-top:12px" type="button" onclick="irParaFinalizar()" ${estado.freteId == null ? "disabled" : ""}>${estado.freteId == null ? "Calcule o frete para continuar" : "Continuar para entrega"}</button>`)}
  </div></div>`;
}
function alterarQtd(chave, d) { const i = db.carrinho.find(x => x.chave === chave); i.qtd = Math.max(1, i.qtd + d); if (estado.fretes.length) calcularFreteCarrinho(); else render(); }
function removerItem(chave) { db.carrinho = db.carrinho.filter(x => x.chave !== chave); estado.fretes = []; estado.freteId = null; toast("Item removido."); render(); }
function irParaFinalizar() { if (!db.sessao) { estado.voltarPara = "#/finalizar"; location.hash = "#/entrar"; toast("Entre ou crie sua conta para finalizar."); } else location.hash = "#/finalizar"; }

// ----- Finalizar compra -----
const checkout = { etapa: 1, endereco: null, pagamento: "Pix" };

function paginaFinalizar() {
  if (!db.carrinho.length) { location.hash = "#/carrinho"; return ""; }
  if (!db.sessao) { location.hash = "#/entrar"; return ""; }
  const cli = db.clientes.find(c => c.id === db.sessao.id);
  if (!checkout.endereco) checkout.endereco = cli.enderecos.find(e => e.principal) || null;
  const e = checkout.endereco;
  const passo = (n, t) => `<li class="${checkout.etapa > n ? "feita" : checkout.etapa === n ? "atual" : ""}">${t}</li>`;
  const t = totais();

  let corpo = "";
  if (checkout.etapa === 1) {
    corpo = `<div class="bloco"><h3>Endereço de entrega</h3>
      ${cli.enderecos.map(x => `<label class="opcao-frete"><input type="radio" name="end" ${e && e.id === x.id ? "checked" : ""} onchange="selecionarEndereco(${x.id})">
        <span class="desc"><strong>${esc(x.apelido)}</strong> · ${esc(x.destinatario)}<small>${esc(x.logradouro)}, ${esc(x.numero)}${x.complemento ? " - " + esc(x.complemento) : ""} · ${esc(x.bairro)} · ${esc(x.cidade)}/${esc(x.uf)} · ${esc(x.cep)}</small></span></label>`).join("")}
      <details ${cli.enderecos.length ? "" : "open"} style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:var(--ametista)">Adicionar novo endereço</summary>
        <div style="margin-top:12px">${formEndereco("novoEnd")}</div>
        <button class="btn btn-contorno" type="button" onclick="salvarEnderecoForm('novoEnd',true)">Salvar e usar este endereço</button>
      </details>
    </div>
    <button class="btn btn-principal" type="button" onclick="avancarEntrega()" ${e ? "" : "disabled"}>Continuar para entrega</button>`;
  } else if (checkout.etapa === 2) {
    corpo = `<div class="bloco"><h3>Forma de entrega</h3>
      <p style="margin:0;color:var(--tinta-suave)">Entregar em: ${esc(e.logradouro)}, ${esc(e.numero)} · ${esc(e.cidade)}/${esc(e.uf)} · <a href="#" onclick="event.preventDefault();checkout.etapa=1;render()">alterar</a></p>
      ${blocoFrete(false)}</div>
    <div style="display:flex;gap:10px"><button class="btn btn-contorno" type="button" onclick="checkout.etapa=1;render()">Voltar</button>
    <button class="btn btn-principal" type="button" onclick="checkout.etapa=3;render()" ${estado.freteId == null ? "disabled" : ""}>Continuar para pagamento</button></div>`;
  } else {
    corpo = `<div class="bloco"><h3>Pagamento</h3>
      ${[["Pix", "Aprovação imediata", db.pagamento.pix], ["Cartão de crédito", `Em até ${db.pagamento.maxParcelas}x${db.pagamento.juros ? " com juros" : " sem juros"}`, db.pagamento.cartao], ["Boleto", "Compensação em até 2 dias úteis", db.pagamento.boleto]].filter(x => x[2]).map(([m, d]) => `
        <label class="opcao-frete"><input type="radio" name="pg" ${checkout.pagamento === m ? "checked" : ""} onchange="checkout.pagamento='${m}';render()"><span class="desc">${m}<small>${d}</small></span></label>`).join("")}
      ${checkout.pagamento === "Cartão de crédito" ? `<div class="aviso aviso-ouro">Na versão final, os dados do cartão serão digitados no formulário seguro do Mercado Pago. A loja não armazena números de cartão.</div>` : ""}
    </div>
    <div class="campo"><label for="obs">Observação para o vendedor <small>(opcional)</small></label><textarea id="obs" placeholder="Ex.: medidas, horário para retirada…"></textarea></div>
    <div style="display:flex;gap:10px"><button class="btn btn-contorno" type="button" onclick="checkout.etapa=2;render()">Voltar</button>
    <button class="btn btn-ouro" type="button" onclick="finalizarPedido()">Finalizar pedido · ${brl(t.total)}</button></div>`;
  }

  return `<div class="recipiente">
    <ol class="etapas">${passo(1, "Endereço")}${passo(2, "Entrega")}${passo(3, "Pagamento")}</ol>
    <div class="carrinho-layout"><div>${corpo}</div>${resumoValores("")}</div>
  </div>`;
}

function formEndereco(pref, e = {}) {
  return `<div class="grade-campos">
    <div class="campo"><label for="${pref}-cep">CEP</label><input id="${pref}-cep" type="text" inputmode="numeric" placeholder="00000-000" value="${esc(e.cep || "")}" oninput="this.value=fmtCep(this.value);if(soDigitos(this.value).length===8)preencherCep('${pref}')"><small id="${pref}-cepinfo"></small></div>
    <div class="campo"><label for="${pref}-apelido">Nome do endereço</label><input id="${pref}-apelido" type="text" placeholder="Casa, trabalho…" value="${esc(e.apelido || "")}"></div>
  </div>
  <div class="campo"><label for="${pref}-dest">Destinatário</label><input id="${pref}-dest" type="text" value="${esc(e.destinatario || db.sessao?.nome || "")}"></div>
  <div class="campo"><label for="${pref}-log">Rua / avenida</label><input id="${pref}-log" type="text" value="${esc(e.logradouro || "")}"></div>
  <div class="grade-campos">
    <div class="campo"><label for="${pref}-num">Número</label><input id="${pref}-num" type="text" value="${esc(e.numero || "")}"></div>
    <div class="campo"><label for="${pref}-comp">Complemento</label><input id="${pref}-comp" type="text" value="${esc(e.complemento || "")}"></div>
  </div>
  <div class="grade-campos">
    <div class="campo"><label for="${pref}-bairro">Bairro</label><input id="${pref}-bairro" type="text" value="${esc(e.bairro || "")}"></div>
    <div class="campo"><label for="${pref}-cidade">Cidade</label><input id="${pref}-cidade" type="text" value="${esc(e.cidade || "")}"></div>
    <div class="campo"><label for="${pref}-uf">UF</label><input id="${pref}-uf" type="text" maxlength="2" value="${esc(e.uf || "")}"></div>
  </div>`;
}
async function preencherCep(pref) {
  const info = $(`#${pref}-cepinfo`); info.textContent = "Buscando endereço…";
  const r = await consultarCep($(`#${pref}-cep`).value);
  if (!r) { info.textContent = "CEP inválido."; return; }
  if (r.logradouro) $(`#${pref}-log`).value = r.logradouro;
  if (r.bairro) $(`#${pref}-bairro`).value = r.bairro;
  if (r.cidade) $(`#${pref}-cidade`).value = r.cidade;
  $(`#${pref}-uf`).value = r.uf;
  info.textContent = r.simulado ? "Sem conexão com o ViaCEP: preencha manualmente." : "Endereço encontrado pelo ViaCEP.";
  $(`#${pref}-num`).focus();
}
function lerEndereco(pref) {
  const v = id => $(`#${pref}-${id}`).value.trim();
  return { apelido: v("apelido") || "Endereço", destinatario: v("dest"), cep: v("cep"), logradouro: v("log"), numero: v("num"), complemento: v("comp"), bairro: v("bairro"), cidade: v("cidade"), uf: v("uf").toUpperCase() };
}
function salvarEnderecoForm(pref, usarNoCheckout) {
  const e = lerEndereco(pref);
  if (soDigitos(e.cep).length !== 8 || !e.logradouro || !e.numero || !e.cidade || e.uf.length !== 2) return toast("Preencha CEP, rua, número, cidade e UF.");
  const cli = db.clientes.find(c => c.id === db.sessao.id);
  e.id = Date.now(); e.principal = !cli.enderecos.length; cli.enderecos.push(e);
  if (usarNoCheckout) selecionarEndereco(e.id); else { toast("Endereço salvo."); render(); }
}
function selecionarEndereco(id) {
  const cli = db.clientes.find(c => c.id === db.sessao.id);
  checkout.endereco = cli.enderecos.find(e => e.id === id);
  render();
}
function avancarEntrega() {
  // Frete é recalculado para o CEP do endereço escolhido
  if (soDigitos(estado.cep) !== soDigitos(checkout.endereco.cep) || !estado.fretes.length) { estado.cep = checkout.endereco.cep; calcularFreteCarrinho(); }
  checkout.etapa = 2; render();
}

function finalizarPedido() {
  const t = totais();
  const numero = Math.max(...db.pedidos.map(p => p.numero)) + 1;
  const agora = new Date().toISOString();
  const pedido = {
    numero, clienteId: db.sessao.id, vendedorId: null, status: "AguardandoPagamento", criadoEm: agora,
    itens: t.itens.map(i => ({ produtoId: i.produto.id, nome: i.produto.nome, variacao: i.variacao ? Object.entries(i.variacao.attrs).map(([k, v]) => `${k}: ${v}`).join(" / ") : "", personalizacao: i.personalizacao, preco: i.unit, qtd: i.qtd, prazo: i.prazo })),
    subtotal: t.subtotal, frete: t.frete.valor, entrega: t.frete.nome, prazoProducao: t.producao, prazoTransporte: t.frete.prazo, rastreio: "",
    pagamento: { metodo: checkout.pagamento, status: "Pendente" }, endereco: { ...checkout.endereco }, observacao: $("#obs")?.value || "",
    historico: [{ status: "PedidoRecebido", em: agora, por: "Sistema" }, { status: "AguardandoPagamento", em: agora, por: "Sistema" }]
  };
  db.pedidos.push(pedido);
  // baixa de estoque dos itens de pronta entrega
  t.itens.forEach(i => { if (i.produto.disponibilidade === "ProntaEntrega") { const alvo = i.variacao || i.produto; alvo.estoque = Math.max(0, alvo.estoque - i.qtd); } i.produto.vendidos += i.qtd; });
  db.carrinho = []; estado.fretes = []; estado.freteId = null; checkout.etapa = 1;
  location.hash = `#/pedido-confirmado/${numero}`;
}

function paginaConfirmado(numero) {
  const p = db.pedidos.find(x => x.numero === +numero);
  if (!p) return paginaInicio();
  const total = p.subtotal + p.frete;
  const msg = encodeURIComponent(`Olá! Fiz o pedido ${numPedido(p.numero)} na ${db.loja.nome}.`);
  return `<div class="recipiente confirmacao">
    ${marcaImg(72, "margin:0 auto")}
    <h1 style="font-size:2rem;margin-top:14px">Pedido recebido</h1>
    <p>Sua ordem de compra foi registrada com o número</p>
    <div class="numero">${numPedido(p.numero)}</div>
    <p>Enviamos a confirmação para <strong>${esc(db.sessao.email)}</strong>. Previsão: até <strong>${diasUteis(p.prazoProducao + p.prazoTransporte)}</strong> após a confirmação do pagamento.</p>
    ${p.pagamento.metodo === "Pix" ? `<div class="pix">
      <svg viewBox="0 0 29 29" style="background:#fff;padding:8px;border-radius:8px" aria-label="QR Code Pix ilustrativo">${Array.from({ length: 29 * 29 }, (_, i) => ((i * 7919) % 13 < 6 || (i % 29 < 7 && Math.floor(i / 29) < 7)) ? `<rect x="${i % 29}" y="${Math.floor(i / 29)}" width="1" height="1"/>` : "").join("")}</svg>
      <div><strong>Pague ${brl(total)} com Pix</strong><code>00020126580014BR.GOV.BCB.PIX0136exemplo-chave-pix-prototipo5204000053039865802BR</code>
      <button class="btn btn-contorno btn-pequeno" type="button" onclick="toast('Código Pix copiado.')">Copiar código</button></div></div>`
      : p.pagamento.metodo === "Boleto" ? `<div class="aviso">O boleto de ${brl(total)} será gerado pelo Mercado Pago e enviado por e-mail.</div>` : `<div class="aviso">Pagamento com cartão em análise pelo Mercado Pago.</div>`}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
      <a class="btn btn-principal" href="#/conta/pedido/${p.numero}">Acompanhar pedido</a>
      <a class="btn btn-whats" href="https://wa.me/${db.loja.whatsapp}?text=${msg}" target="_blank" rel="noopener">${ic.whats} Falar sobre este pedido</a>
    </div>
    <p style="margin-top:22px"><button class="btn btn-contorno btn-pequeno" type="button" onclick="simularPagamento(${p.numero})">Simular confirmação do Mercado Pago</button></p>
  </div>`;
}
function simularPagamento(n) {
  const p = db.pedidos.find(x => x.numero === n);
  if (p.status !== "AguardandoPagamento") return toast("Este pedido já teve o pagamento confirmado.");
  p.status = "PagamentoConfirmado"; p.pagamento.status = "Aprovado";
  p.historico.push({ status: "PagamentoConfirmado", em: new Date().toISOString(), por: "Mercado Pago" });
  toast("Pagamento confirmado automaticamente (webhook simulado).");
  location.hash = `#/conta/pedido/${n}`;
}

// ----- Entrar / cadastrar -----
let abaEntrar = "entrar";
function paginaEntrar() {
  return `<div class="recipiente entrar">

function entrar(f) {
  const c = db.clientes.find(x => x.email === f.email.value.trim().toLowerCase());
  if (!c || f.senha.value.length < 8) return toast("E-mail ou senha incorretos.");
  db.sessao = { id: c.id, nome: c.nome, email: c.email };
  toast(`Bem-vindo(a), ${c.nome.split(" ")[0]}.`);
  location.hash = estado.voltarPara || "#/conta"; estado.voltarPara = null;
}
function criarConta(f) {
  const email = f.email.value.trim().toLowerCase();
  if (db.clientes.some(c => c.email === email)) return toast("Já existe uma conta com este e-mail. Use a opção Entrar.");
  const c = { id: Date.now(), nome: f.nome.value.trim(), email, telefone: f.tel.value, cpf: "", criadoEm: new Date().toISOString(), enderecos: [] };
  db.clientes.push(c);
  db.sessao = { id: c.id, nome: c.nome, email: c.email };
  toast("Conta criada.");
  location.hash = estado.voltarPara || "#/conta/enderecos"; estado.voltarPara = null;
}
// Protótipo: simula o token que o botão do Google devolveria e o que a API faz com ele —
// cadastro automático no primeiro acesso, login direto depois (na versão final, o servidor confere o token).
function entrarComGoogle() {
  const email = "cliente.google@gmail.com";
  let c = db.clientes.find(x => x.email === email);
  const novo = !c;
  if (!c) {
    c = { id: Date.now(), nome: "Cliente Google", email, telefone: "", cpf: "", criadoEm: new Date().toISOString(), enderecos: [] };
    db.clientes.push(c);
  }
  db.sessao = { id: c.id, nome: c.nome, email: c.email };
  toast(novo ? "Conta criada automaticamente com o Google." : `Bem-vindo(a) de volta, ${c.nome.split(" ")[0]}.`);
  location.hash = estado.voltarPara || "#/conta"; estado.voltarPara = null;
}

  const atual = FLUXO.indexOf(p.status);
  return `<ul class="linha-tempo">${FLUXO.map((s, i) => { const h = [...p.historico].reverse().find(x => x.status === s);
    return `<li class="${i < atual ? "feito" : i === atual ? "atual" : ""}">${STATUS[s]}${h ? `<small>${dataHoraBR(h.em)}</small>` : ""}${s === "Enviado" && p.rastreio ? `<small>Rastreio: <strong>${esc(p.rastreio)}</strong></small>` : ""}</li>`; }).join("")}</ul>`;
}

// =====================================================================
//  SEGURANÇA DO PAINEL
//  Só entra quem tem um dos perfis permitidos — hoje, apenas Administrador.
//  Os vendedores continuam cadastrados e a tela deles segue aqui, pronta
//  para o dia em que o acesso for liberado (na API, Painel:PerfisPermitidos).
// =====================================================================
const PERFIS_COM_ACESSO_AO_PAINEL = ["Administrador"];
const TENTATIVAS_ATE_BLOQUEAR = 5;
const MINUTOS_DE_BLOQUEIO = 15;

const painel = { sessao: null, tentativas: {}, bloqueios: {}, acessos: [], voltarPara: null };

function registrarAcesso(email, sucesso, motivo, origem = "painel") {
  painel.acessos.unshift({ em: new Date().toISOString(), email: (email || "").toLowerCase(), sucesso, motivo, origem, ip: "189.45.12.77", navegador: navigator.userAgent.slice(0, 60) });
  painel.acessos = painel.acessos.slice(0, 200);
}

function entrarNoPainel(f) {
  const email = f.email.value.trim().toLowerCase();
  const senha = f.senha.value;
  const bloqueadoAte = painel.bloqueios[email];

  if (bloqueadoAte && bloqueadoAte > Date.now()) {
    const faltam = Math.ceil((bloqueadoAte - Date.now()) / 60000);
    registrarAcesso(email, false, "ContaBloqueada");
    return mostrarErroLogin(`Conta bloqueada por mais ${faltam} minuto(s) após várias senhas incorretas.`);
  }

  const conta = db.equipe.find(e => e.email.toLowerCase() === email);
  const senhaConfere = conta && conta.senha === senha;
  const cliente = db.clientes.find(c => c.email.toLowerCase() === email);

  if (!conta && !cliente) { registrarAcesso(email, false, "UsuarioInexistente"); return recusar(email, "Acesso não autorizado"); }
  if (conta && !senhaConfere) { registrarAcesso(email, false, "SenhaIncorreta"); return recusar(email, "Acesso não autorizado"); }
  if (cliente && !conta) { registrarAcesso(email, false, "SemPermissao"); return mostrarErroLogin("Acesso não autorizado"); }
  if (!conta.ativo) { registrarAcesso(email, false, "ContaInativa"); return mostrarErroLogin("Acesso não autorizado"); }
  if (!PERFIS_COM_ACESSO_AO_PAINEL.includes(conta.perfil)) {
    // senha certa, mas o perfil não tem acesso ao painel
    registrarAcesso(email, false, "SemPermissao");
    return mostrarErroLogin("Acesso não autorizado");
  }

  delete painel.tentativas[email];
  delete painel.bloqueios[email];
  registrarAcesso(email, true, "Ok");
  painel.sessao = { id: conta.id, nome: conta.nome, email: conta.email, perfil: conta.perfil, entrouEm: Date.now() };
  db.vendedorAtual = conta.id;   // o painel continua registrando quem atende cada pedido
  toast(`Bem-vindo(a), ${conta.nome.split(" ")[0]}.`);
  location.hash = painel.voltarPara || "#/painel";
  painel.voltarPara = null;
  render();
}

function recusar(email, mensagem) {
  painel.tentativas[email] = (painel.tentativas[email] || 0) + 1;
  const restantes = TENTATIVAS_ATE_BLOQUEAR - painel.tentativas[email];
  if (restantes <= 0) {
    painel.bloqueios[email] = Date.now() + MINUTOS_DE_BLOQUEIO * 60000;
    painel.tentativas[email] = 0;
    return mostrarErroLogin(`Conta bloqueada por ${MINUTOS_DE_BLOQUEIO} minutos após ${TENTATIVAS_ATE_BLOQUEAR} tentativas.`);
  }
  mostrarErroLogin(`${mensagem}${restantes <= 2 ? ` · ${restantes} tentativa(s) antes do bloqueio` : ""}`);
}

function mostrarErroLogin(mensagem) {
  const alvo = $("#erroLogin");
  if (alvo) alvo.textContent = mensagem;
}

function sairDoPainel() {
  if (painel.sessao) registrarAcesso(painel.sessao.email, true, "Saida");
  painel.sessao = null;
  toast("Você saiu do painel.");
  location.hash = "#/painel";
  render();
}

function trocarSenhaPainel(f) {
  const conta = db.equipe.find(e => e.id === painel.sessao.id);
  if (f.atual.value !== conta.senha) return $("#erroSenha").textContent = "Senha atual incorreta.";
  if (f.nova.value.length < 8) return $("#erroSenha").textContent = "A senha precisa ter pelo menos 8 caracteres.";
  if (f.nova.value !== f.repete.value) return $("#erroSenha").textContent = "A confirmação não confere com a nova senha.";
  conta.senha = f.nova.value;
  registrarAcesso(conta.email, true, "SenhaAlterada");
  toast("Senha alterada. As outras sessões foram encerradas.");
  location.hash = "#/painel";
  render();
}

function registrar(p, status, obs) { p.historico.push({ status, em: new Date().toISOString(), por: vendedor().nome, obs }); p.status = status; }
function assumirPedido(n) { const p = db.pedidos.find(x => x.numero === n); p.vendedorId = db.vendedorAtual; toast(`Pedido ${numPedido(n)} assumido por você.`); render(); }
function mudarStatus(n) {
  const p = db.pedidos.find(x => x.numero === n); const novo = $("#novoStatus").value;
  if (novo === "Enviado" && !p.rastreio && p.entrega !== "Retirada no local") return toast("Informe o código de rastreamento antes de marcar como enviado.");
  if (novo === "Cancelado") return cancelarPedido(n);
  if (novo === "PagamentoConfirmado") p.pagamento.status = "Aprovado";
  registrar(p, novo, $("#comentario").value.trim());
  toast(`Status atualizado para “${STATUS[novo]}”. E-mail enviado ao cliente.`); render();
}
function cancelarPedido(n) {
  const motivo = prompt("Motivo do cancelamento (será registrado no histórico):");
  if (motivo === null) return;
  const p = db.pedidos.find(x => x.numero === n);
  registrar(p, "Cancelado", motivo || "Sem motivo informado");
  if (p.pagamento.status === "Aprovado") p.pagamento.status = "Estornado";
  toast("Pedido cancelado."); render();
}
function salvarRastreio(n) { const p = db.pedidos.find(x => x.numero === n); p.rastreio = $("#rastreio").value.trim().toUpperCase(); toast("Código de rastreamento salvo."); render(); }
function confirmarPagamentoManual(n) {
  const p = db.pedidos.find(x => x.numero === n);
  if (!confirm(`Confirmar o recebimento de ${brl(p.subtotal + p.frete)} para ${numPedido(n)}?`)) return;
  p.pagamento.status = "Aprovado"; p.pagamento.metodo += " · confirmado manualmente";
  registrar(p, "PagamentoConfirmado", "Pagamento confirmado manualmente"); toast("Pagamento confirmado."); render();
}

const taxaDe = metodo => {
  const base = metodo.startsWith("Cartão") ? "Cartão de crédito" : metodo.startsWith("Pix") ? "Pix" : metodo.startsWith("Boleto") ? "Boleto" : null;
  return base ? db.pagamento.taxas[base] : 0;   // confirmação manual não tem taxa de gateway
};

/* Lista de recebimentos montada a partir dos pedidos. Na API, isto vem de
   /api/admin/pagamentos, já com a taxa informada pelo Mercado Pago quando existir. */
function recebimentos() {
  return db.pedidos.map(p => {
    const valor = p.subtotal + p.frete;
    const taxa = Math.round(valor * taxaDe(p.pagamento.metodo)) / 100;
    const estornado = p.pagamento.estornado || 0;
    return {
      numero: p.numero, cliente: cliente(p.clienteId).nome, metodo: p.pagamento.metodo,
      status: p.pagamento.status, valor, taxa, estornado,
      liquido: Math.round((valor - taxa - estornado) * 100) / 100,
      ambiente: db.pagamento.conectado ? db.pagamento.ambiente : "simulado",
      criadoEm: p.criadoEm, podeEstornar: p.pagamento.status === "Aprovado" && estornado < valor
    };
  }).sort((a, b) => b.numero - a.numero);
}

function conectarMercadoPago(f) {
  const token = f.token.value.trim();
  const ambiente = f.ambiente.value;
  if (!db.pagamento.conectado && token.length < 20) return toast("Cole o Access Token completo do Mercado Pago.");
  if (token && token.length < 20) return toast("Access Token inválido.");
  if (ambiente === "producao" && token.startsWith("TEST-")) return toast("Esse token é do ambiente de teste. Use o token de produção.");

  // no sistema: PUT /api/admin/pagamentos/credencial → o servidor testa e só grava se a conta responder
  db.pagamento.ambiente = ambiente;
  if (token) {
    db.pagamento.tokenMascarado = (token.startsWith("APP_USR-") ? "APP_USR-" : token.startsWith("TEST-") ? "TEST-" : "") + "••••••••" + token.slice(-4);
    db.pagamento.conectado = true;
    db.pagamento.conta = ambiente === "producao" ? "loja-amanhecer (produção)" : "loja-amanhecer (teste)";
  }
  db.pagamento.ultimoTeste = new Date().toISOString();
  db.pagamento.ultimoTesteOk = true;
  f.token.value = "";
  toast("Conexão testada e conta conectada.");
  render();
}

function testarConexaoMP() {
  db.pagamento.ultimoTeste = new Date().toISOString();
  db.pagamento.ultimoTesteOk = db.pagamento.conectado;
  toast(db.pagamento.conectado ? "Conta respondeu certo." : "Modo simulado: nenhuma conta conectada.");
  render();
}

function desconectarMercadoPago() {
  if (!confirm("Desconectar a conta do Mercado Pago? A loja volta ao modo simulado e nenhuma cobrança real será feita.")) return;
  Object.assign(db.pagamento, { conectado: false, tokenMascarado: "", conta: null, ultimoTesteOk: false });
  toast("Conta desconectada. A loja voltou ao modo simulado.");
  render();
}

function salvarFormasDePagamento(f) {
  const cfg = db.pagamento;
  if (!cfg.pix && !cfg.cartao && !cfg.boleto) return toast("Deixe pelo menos uma forma de pagamento ativa.");
  const parcelas = parseInt(f.parcelas.value, 10);
  if (cfg.cartao && (!parcelas || parcelas < 1 || parcelas > 24)) return toast("O máximo de parcelas deve ficar entre 1 e 24.");
  if (cfg.cartao) {
    cfg.maxParcelas = parcelas;
    cfg.minimoParcela = Math.max(0, parseFloat(f.minimo.value) || 0);
    cfg.juros = f.juros.checked;
  }
  toast("Formas de pagamento salvas. A loja já passa a mostrar só o que está ativo.");
  render();
}

function estornarPagamento(numero) {
  const p = db.pedidos.find(x => x.numero === numero);
  const valor = p.subtotal + p.frete;
  const disponivel = valor - (p.pagamento.estornado || 0);
  const resposta = prompt(`Estorno do pedido ${numPedido(numero)}.\nValor disponível: ${brl(disponivel)}.\nDigite o valor a estornar ou deixe em branco para estornar tudo:`);
  if (resposta === null) return;
  const parcial = resposta.trim() ? parseFloat(resposta.replace(",", ".")) : null;
  if (parcial !== null && (isNaN(parcial) || parcial <= 0)) return toast("Valor inválido.");
  if (parcial !== null && parcial > disponivel) return toast(`O máximo que ainda pode ser estornado é ${brl(disponivel)}.`);

  const devolvido = parcial ?? disponivel;
  p.pagamento.estornado = (p.pagamento.estornado || 0) + devolvido;
  if (p.pagamento.estornado >= valor) p.pagamento.status = "Estornado";
  toast(`${brl(devolvido)} estornado${db.pagamento.conectado ? " no Mercado Pago" : " (modo simulado)"}.`);
  render();
}

/* Opções do campo de categoria: só as que estão no ar, agrupadas por categoria principal.
   A categoria já vinculada ao produto entra mesmo desativada, para não perder o vínculo. */
function opcoesDeCategoria(selecionada) {
  const partes = [];
  db.categorias.forEach(c => {
    const subsVisiveis = c.subs.filter(sc => sc.ativa !== false || sc.id === selecionada);
    const paiVisivel = c.ativa !== false || c.id === selecionada || subsVisiveis.some(sc => sc.id === selecionada);
    if (!paiVisivel) return;

    const rotulo = nome => `${esc(nome)}`;
    const marca = cat => cat.ativa === false ? " (desativada)" : "";
    const grupo = [];
    if (c.ativa !== false || c.id === selecionada)
      grupo.push(`<option value="${c.id}" ${selecionada === c.id ? "selected" : ""}>${rotulo(c.nome)}${marca(c)}</option>`);
    subsVisiveis.forEach(sc => {
      // a subcategoria de uma categoria desativada também fica fora do ar
      const foraDoAr = sc.ativa === false || c.ativa === false;
      grupo.push(`<option value="${sc.id}" ${selecionada === sc.id ? "selected" : ""}>${rotulo(sc.nome)}${foraDoAr ? " (desativada)" : ""}</option>`);
    });
    partes.push(`<optgroup label="${esc(c.nome)}${marca(c)}">${grupo.join("")}</optgroup>`);
  });
  return partes.join("") || `<option value="">Nenhuma categoria ativa — crie uma em Categorias</option>`;
}

          <div class="campo"><label for="fPeso">Peso (g)</label><input id="fPeso" type="number" min="1" value="${r.peso}" onchange="rascunho.peso=+this.value"></div>
          <div class="campo"><label for="fA">Altura (cm)</label><input id="fA" type="number" min="1" value="${r.dim[0]}" onchange="rascunho.dim[0]=+this.value"></div>
          <div class="campo"><label for="fL">Largura (cm)</label><input id="fL" type="number" min="1" value="${r.dim[1]}" onchange="rascunho.dim[1]=+this.value"></div>
          <div class="campo"><label for="fC">Comprimento (cm)</label><input id="fC" type="number" min="1" value="${r.dim[2]}" onchange="rascunho.dim[2]=+this.value"></div>
        </div>
      </section>
